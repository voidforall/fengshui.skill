name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
        lunar: [true, false]
    name: py${{ matrix.python }} lunar=${{ matrix.lunar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install lunar_python
        if: matrix.lunar
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
