name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        lunar: [true, false]
    name: py${{ matrix.python }} lunar=${{ matrix.lunar }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install lunar_python
        if: matrix.lunar
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  skill-spec:
    runs-on: ubuntu-latest
    name: Agent Skills 规范校验
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validator
        run: pip install skills-ref
      # 安装后 skill 目录按 name 命名（fengshui-master）；仓库目录名 fengshui.skill 含点号，按规范不能作 name，
      # 故复制到与 name 同名的目录再校验，即用户实际安装后的形态。
      - name: Validate
        run: |
          mkdir -p "$RUNNER_TEMP/skill"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/skill"
          mv "$RUNNER_TEMP/skill" "$RUNNER_TEMP/fengshui-master"
          agentskills validate "$RUNNER_TEMP/fengshui-master"
