name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        lunar: [true, false]
    name: py${{ matrix.python }} lunar=${{ matrix.lunar }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install lunar_python
        if: matrix.lunar
        run: pip install -r requirements.txt
      - name: Install city map geometry validation
        run: pip install -r skills/city-wuxing-map/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test local address search
        run: node --test tests/city_search.test.cjs
      - name: Run tests
        run: python -m unittest discover -s tests -v

  skill-spec:
    runs-on: ubuntu-latest
    name: Agent Skills 规范校验
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validator
        run: pip install skills-ref
      # 每个 skill 放在 skills/<name>/，目录名即 skill 名，与安装后的形态一致。
      - name: Validate
        run: |
          mkdir -p "$RUNNER_TEMP/repo"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/repo"
          for s in fengshui-master bazi-mingli city-wuxing-map; do
            agentskills validate "$RUNNER_TEMP/repo/skills/$s"
          done
