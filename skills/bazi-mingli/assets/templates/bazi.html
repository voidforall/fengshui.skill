<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* 命书：册页上并列四柱，干在上、支在下；柱间以弧线标合冲刑害。下方为大运流年的岁月轴。
   与飞星盘同一套册页配色：浅色宣纸，深色黑漆描金。五行取《五行大义》五色：木青、火赤、土黄、金白、水黑
   （白、黑在纸上难辨，以银灰、玄青代之）。 */
:root {
  --paper: #ece2cb; --paper-2: #e3d6b8; --ink: #26211b; --ink-soft: #5d5446; --rule: #b9a985;
  --cinnabar: #b03a2e; --azurite: #2f5d6e; --gold: #9a7431; --seal-text: #f6efe0;
  --wx-mu: #2f7356; --wx-huo: #b23a2c; --wx-tu: #95701f; --wx-jin: #6f737b; --wx-shui: #1f3a55;
  --font-brush: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", "BiauKai", serif;
  --font-song: "Noto Serif SC", "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16120e; --paper-2: #211a14; --ink: #eadcbf; --ink-soft: #b3a283; --rule: #5a4a33;
    --cinnabar: #d9604f; --azurite: #7fb0bf; --gold: #d2a856; --seal-text: #1b130d;
    --wx-mu: #79c29b; --wx-huo: #e5765f; --wx-tu: #d8b05a; --wx-jin: #e4dfd3; --wx-shui: #8db4dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16120e; --paper-2: #211a14; --ink: #eadcbf; --ink-soft: #b3a283; --rule: #5a4a33;
  --cinnabar: #d9604f; --azurite: #7fb0bf; --gold: #d2a856; --seal-text: #1b130d;
  --wx-mu: #79c29b; --wx-huo: #e5765f; --wx-tu: #d8b05a; --wx-jin: #e4dfd3; --wx-shui: #8db4dc;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  background-image:
    radial-gradient(ellipse at 20% 0%, color-mix(in srgb, var(--gold) 10%, transparent), transparent 60%),
    radial-gradient(ellipse at 100% 100%, color-mix(in srgb, var(--cinnabar) 6%, transparent), transparent 55%);
  color: var(--ink); font-family: var(--font-song); font-size: 15px; line-height: 1.75;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; min-width: 0; }
.wx-木 { color: var(--wx-mu); } .wx-火 { color: var(--wx-huo); } .wx-土 { color: var(--wx-tu); }
.wx-金 { color: var(--wx-jin); } .wx-水 { color: var(--wx-shui); }
.bg-木 { background: var(--wx-mu); } .bg-火 { background: var(--wx-huo); } .bg-土 { background: var(--wx-tu); }
.bg-金 { background: var(--wx-jin); } .bg-水 { background: var(--wx-shui); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* 题签 */
header.title { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 18px; }
.seal { width: 64px; height: 64px; flex: none; margin-top: 6px; }
.seal rect { fill: var(--cinnabar); }
.seal text { fill: var(--seal-text); font-family: var(--font-brush); font-size: 21px; text-anchor: middle; dominant-baseline: central; }
.title-text { min-width: 0; flex: 1 1 320px; }
h1 { font-family: var(--font-brush); font-weight: 400; font-size: clamp(34px, 6vw, 52px); line-height: 1.1; margin: 0; letter-spacing: .04em; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 8px 0 0; padding: 0; list-style: none; color: var(--ink-soft); font-size: 14px; }
.facts b { color: var(--ink); font-weight: 600; }
.warn { color: var(--cinnabar); font-size: 14px; margin: 6px 0 0; }
.time-lines { margin: 6px 0 0; color: var(--ink-soft); font-size: 13px; }
.time-lines summary { cursor: pointer; width: fit-content; }
.time-lines p { margin: 2px 0; }

h2.sec, h3 { font-family: var(--font-brush); font-weight: 400; }
h2.sec { font-size: 28px; margin: 0 0 8px; line-height: 1.3; }
h3 { font-size: 22px; margin: 0 0 6px; line-height: 1.3; }

/* 版心：左命盘、右批注 */
.board-wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .board-wrap { grid-template-columns: minmax(0, 1fr); } }
.plate { display: grid; gap: 10px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.chip { font: inherit; font-size: 14px; color: var(--ink-soft); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-soft); background: var(--paper-2); }
.btn-cast { font-family: var(--font-brush); font-size: 22px; color: var(--seal-text); background: var(--cinnabar); border: 0; border-radius: 4px; padding: 2px 22px; cursor: pointer; letter-spacing: .2em; }
.btn-cast:hover { filter: brightness(1.08); }

.chart { display: grid; gap: 0; }
.band { width: 100%; height: auto; display: block; overflow: visible; }
.band .arc { fill: none; stroke-width: 1.6; cursor: pointer; }
.band .arc.he { stroke: var(--gold); }
.band .arc.chong { stroke: var(--cinnabar); stroke-width: 2; }
.band .arc.xing, .band .arc.hai { stroke: var(--cinnabar); stroke-dasharray: 5 4; }
.band .arc.que { stroke: var(--rule); stroke-dasharray: 2 4; }
.band .arc.on { stroke-width: 3.2; }
.band g { outline: none; }
.band g:focus-visible .arc { stroke-width: 3.2; filter: drop-shadow(0 0 2px var(--gold)); }
.band .hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
.band text { font-family: var(--font-song); font-size: 13px; fill: var(--ink-soft); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.band text.lab-bg { stroke: var(--paper); stroke-width: 5px; paint-order: stroke; }
.band.off { display: none; }

.cols { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 8px; }
.col { background: var(--paper-2); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 4px 10px; text-align: center; display: grid; gap: 2px; justify-items: center; align-content: start; min-width: 0;
       transform-origin: 50% 50%; transition: transform .55s cubic-bezier(.2,.7,.2,1), opacity .55s; }
.col.day { border-color: var(--cinnabar); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cinnabar) 40%, transparent); }
.col.flip { transform: perspective(600px) rotateY(88deg); opacity: 0; }
.col-label { font-size: 13px; color: var(--ink-soft); letter-spacing: .1em; }
.ss { font-size: 13px; color: var(--ink-soft); min-height: 1.6em; }
.col.day .ss { color: var(--cinnabar); }
.glyph { font-family: var(--font-brush); font-size: clamp(40px, 9vw, 62px); line-height: 1.1; background: transparent; border: 0; border-radius: 4px; padding: 0 6px; cursor: pointer; }
.glyph:hover { background: color-mix(in srgb, var(--gold) 12%, transparent); }
.glyph.sel { background: color-mix(in srgb, var(--gold) 24%, transparent); box-shadow: 0 0 0 1.5px var(--gold); }
.glyph.lit { text-shadow: 0 0 0.5px currentColor; background: color-mix(in srgb, var(--gold) 16%, transparent); }
.hid { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 0; font-size: 13px; line-height: 1.5; }
.hid li { white-space: nowrap; }
.hid b { font-family: var(--font-brush); font-weight: 400; font-size: 18px; margin-right: 3px; }
.hid span { color: var(--ink-soft); }
.hid.off { display: none; }
.meta { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
.tag { display: inline-block; font-size: 11px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; margin: 1px; color: var(--ink-soft); white-space: nowrap; }
.tag.kong { border-color: var(--cinnabar); color: var(--cinnabar); }
.legend-line { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; font-size: 12px; color: var(--ink-soft); margin: 2px 0 0; }
.legend-line i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: 3px; margin-right: 4px; }
.legend-line .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
@media (max-width: 420px) { .hid { font-size: 12px; } .hid b { font-size: 16px; } .hid span.qi { display: none; } .tag .g { display: block; margin-left: 0; } .tag { white-space: normal; } }

/* 批注栏 */
aside.notes { display: grid; gap: 18px; min-width: 0; }
.leaf { border-left: 3px solid var(--cinnabar); padding: 2px 0 2px 16px; min-width: 0; }
.leaf h2 { font-family: var(--font-brush); font-weight: 400; font-size: 28px; margin: 0; line-height: 1.3; }
.leaf .sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 6px; }
.leaf ul.facts-list { margin: 6px 0; padding-left: 1.2em; }
.leaf ul.facts-list li { margin: 2px 0; }
.note { margin: 8px 0 0; white-space: pre-wrap; }
.note.empty { color: var(--ink-soft); font-size: 14px; }
.advice { margin: 6px 0 0; padding-left: 1.3em; }

/* 岁月轴 */
section.yun { display: grid; gap: 12px; min-width: 0; }
.track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(84px, 1fr); gap: 6px; overflow-x: auto; padding: 4px 2px 8px; scroll-snap-type: x proximity; }
.yun-card { font: inherit; background: var(--paper-2); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 4px; cursor: pointer; text-align: center; scroll-snap-align: start; position: relative; }
.yun-card .gz { font-family: var(--font-brush); font-size: 28px; line-height: 1.15; display: block; }
.yun-card .y { font-size: 12px; color: var(--ink-soft); display: block; }
.yun-card[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1.5px var(--gold); }
.yun-card.pre .gz { font-size: 20px; color: var(--ink-soft); }
.now { position: absolute; top: -8px; right: -4px; font-family: var(--font-brush); font-size: 14px; color: var(--seal-text); background: var(--cinnabar); border-radius: 3px; padding: 0 5px; line-height: 1.5; }
.slider-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.slider-row input[type=range] { flex: 1 1 240px; accent-color: var(--cinnabar); min-width: 0; }
.slider-row output { font-family: var(--font-brush); font-size: 22px; min-width: 9em; }
.years { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
@media (max-width: 640px) { .years { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.year { font: inherit; background: transparent; color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; padding: 2px 0; cursor: pointer; text-align: center; position: relative; }
.year .gz { font-family: var(--font-brush); font-size: 20px; display: block; line-height: 1.2; }
.year .y { font-size: 11px; color: var(--ink-soft); display: block; }
.year[aria-pressed="true"] { background: var(--paper-2); border-color: var(--gold); box-shadow: inset 0 0 0 1.5px var(--gold); }
.year.has-rel::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--cinnabar); }
.year.has-note::before { content: ""; position: absolute; top: 3px; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
.yun-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 700px) { .yun-detail { grid-template-columns: minmax(0, 1fr); } }

/* 下栏 */
.lower { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .lower { grid-template-columns: minmax(0, 1fr); } }
blockquote { margin: 8px 0; padding: 8px 14px; border-left: 3px solid var(--gold); background: color-mix(in srgb, var(--paper-2) 70%, transparent); font-size: 15px; }
blockquote .k { display: inline-block; font-size: 12px; color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; margin-right: 6px; }
.src { font-size: 13px; color: var(--ink-soft); margin: 4px 0 0; }
.src a { color: inherit; }
.wx-bars { margin-top: 4px; display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); gap: 4px 10px; align-items: center; font-size: 13px; }
.wx-bars .h { color: var(--ink-soft); font-size: 12px; }
.wx-bars .name { font-family: var(--font-brush); font-size: 20px; line-height: 1; }
.bar { height: 12px; display: flex; align-items: center; gap: 6px; }
.bar span.fill { display: inline-block; height: 10px; border-radius: 2px; min-width: 2px; }
.bar span.n { font-size: 12px; color: var(--ink-soft); }
.siling { display: flex; gap: 4px; margin: 6px 0; }
.siling div { border: 1px solid var(--rule); border-radius: 3px; padding: 2px 6px; font-size: 13px; text-align: center; color: var(--ink-soft); }
.siling div.on { border-color: var(--gold); color: var(--ink); background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--gold); }
#wx, #shensha { margin-top: 20px; }
.ss-list { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 4px; font-size: 14px; }
.ss-list b { font-weight: 600; }

/* 白话：一眼看懂、术语按钮、释义卡、术语表 */
section.plain { display: grid; gap: 12px; }
.plain-lead { font-size: 17px; line-height: 1.85; margin: 0; padding: 12px 16px; border-left: 3px solid var(--gold); background: color-mix(in srgb, var(--paper-2) 70%, transparent); }
.plain-lead p { margin: 0 0 8px; } .plain-lead p:last-child { margin: 0; }
.plain-lead.empty { font-size: 14px; color: var(--ink-soft); }
.plain-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.pcard { background: var(--paper-2); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px; min-width: 0; }
.pcard h3 { font-size: 20px; margin: 0 0 4px; }
.pcard p { margin: 4px 0; }
.pcard .big { font-family: var(--font-brush); font-size: 52px; line-height: 1; float: left; margin: 2px 12px 0 0; }
.pcard .q { color: var(--ink-soft); font-size: 14px; }
.pcard .hint { color: var(--ink-soft); font-size: 13px; }
.term { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: help; border-bottom: 1px dotted currentColor; text-underline-offset: 3px; }
.term:hover { color: var(--gold); }
.qmark { font: inherit; font-size: 13px; color: var(--ink-soft); background: none; border: 1px solid var(--rule); border-radius: 50%; width: 1.6em; height: 1.6em; line-height: 1.4; padding: 0; margin-left: 8px; cursor: help; vertical-align: 4px; font-family: var(--font-song); }
.gloss { font-size: 12px; color: var(--gold); line-height: 1.2; min-height: 1.2em; }
.plain-off .gloss, .plain-off .tag .g { display: none; }
.tag .g { color: var(--gold); margin-left: 2px; }
#tip { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); background: var(--paper-2); color: var(--ink); border: 1px solid var(--gold); border-radius: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.25); padding: 12px 40px 12px 16px; z-index: 10; }
#tip[hidden] { display: none; }
#tip h4 { font-family: var(--font-brush); font-weight: 400; font-size: 22px; margin: 0 0 2px; }
#tip p { margin: 4px 0; }
#tip .basis { font-size: 12px; color: var(--ink-soft); }
#tip button.x { position: absolute; top: 6px; right: 8px; font-size: 20px; background: none; border: 0; color: var(--ink-soft); cursor: pointer; }
details.glossary summary { cursor: pointer; font-family: var(--font-brush); font-size: 22px; }
details.glossary dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 10px 0 0; font-size: 14px; }
details.glossary dt { font-weight: 600; }
details.glossary dd { margin: 0; }
details.glossary dd .basis { color: var(--ink-soft); font-size: 12px; }
details.glossary h4 { grid-column: 1 / -1; margin: 10px 0 0; font-family: var(--font-brush); font-weight: 400; font-size: 18px; }
.why { margin: 6px 0 0; padding-left: 1.2em; font-size: 13px; color: var(--ink-soft); }

footer { border-top: 1px solid var(--rule); padding-top: 14px; color: var(--ink-soft); font-size: 13px; display: grid; gap: 4px; }
footer p { margin: 0; }
@media (prefers-reduced-motion: reduce) { .col { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <header class="title">
    <svg class="seal" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="2" y="2" width="60" height="60" rx="5"></rect>
      <text x="45" y="20">堪</text><text x="45" y="44">輿</text>
      <text x="19" y="20">子</text><text x="19" y="44">印</text>
    </svg>
    <div class="title-text">
      <h1 id="title"></h1>
      <ul class="facts" id="facts"></ul>
      <div id="warnings"></div>
      <details class="time-lines" id="time-lines"><summary>排盘口径</summary></details>
    </div>
  </header>

  <section class="plain" aria-labelledby="plain-title">
    <h2 class="sec" id="plain-title">一眼看懂</h2>
    <div class="plain-lead" id="plain-lead"></div>
    <div class="plain-grid" id="plain-grid"></div>
  </section>

  <div class="board-wrap">
    <div class="plate">
      <div class="toolbar" role="group" aria-label="显示">
        <button class="btn-cast" id="cast" type="button">排盘</button>
        <button class="chip" type="button" data-toggle="plain" aria-pressed="true">白话</button>
        <button class="chip" type="button" data-toggle="rel" aria-pressed="true">合冲刑害</button>
        <button class="chip" type="button" data-toggle="hid" aria-pressed="true">藏干</button>
      </div>
      <div class="chart" id="chart">
        <svg class="band" id="band-gan" role="img" aria-label="天干关系"></svg>
        <div class="cols" id="cols"></div>
        <svg class="band" id="band-zhi" role="img" aria-label="地支关系"></svg>
      </div>
      <div class="legend-line" id="legend"></div>
    </div>
    <aside class="notes" aria-live="polite">
      <div class="leaf" id="detail"></div>
    </aside>
  </div>

  <section class="yun" aria-labelledby="yun-title">
    <h2 class="sec" id="yun-title">大运流年</h2>
    <div class="track" id="track" role="group" aria-label="大运"></div>
    <div class="slider-row">
      <input type="range" id="slider" aria-label="拖动选择年份">
      <output id="slider-out" for="slider"></output>
    </div>
    <div class="years" id="years" role="group" aria-label="流年"></div>
    <div class="yun-detail">
      <div class="leaf" id="dayun-detail"></div>
      <div class="leaf" id="year-detail"></div>
    </div>
  </section>

  <div class="lower">
    <section aria-labelledby="th-title">
      <h2 class="sec" id="th-title">调候 · 《穷通宝鉴》原文</h2>
      <div id="tiaohou"></div>
    </section>
    <section aria-labelledby="facts-title">
      <h2 class="sec" id="facts-title">月令 · 五行 · 神煞</h2>
      <div id="siling"></div>
      <div id="wx"></div>
      <div id="shensha"></div>
    </section>
  </div>

  <section class="leaf" id="overall"></section>

  <details class="glossary" id="glossary"><summary>术语表：看不懂的词都在这里</summary><dl id="glossary-list"></dl></details>

  <div id="tip" role="dialog" aria-live="polite" hidden><button class="x" type="button" aria-label="关闭">×</button><h4></h4><p class="plain-text"></p><p class="basis"></p></div>

  <footer>
    <p id="source"></p>
    <p>命理为传统文化的一种推演，不定人生。柱中干支、藏干、关系与神煞由脚本查表得出；旺衰、格局、用神是解读，见批注与对话。</p>
  </footer>
</div>

<script id="chart-data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("chart-data").textContent);
  var N = D.pillars.length;
  var notes = D.notes || {};
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SVGNS = "http://www.w3.org/2000/svg";
  function h(tag, cls, text, parent) {
