<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>__TITLE__</title>
<style>__LEAFLET_CSS__</style>
<style>
:root { color-scheme: light; --paper:#ece2cb; --card:#f6f0e3; --ink:#26211b; --soft:#655a49; --rule:#b9a985; --red:#b03a2e; --gold:#9a7431; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:"Songti SC","Noto Serif CJK SC",serif; line-height:1.65; }
main { max-inline-size:1600px; margin:auto; padding:clamp(1rem, 3vw, 2.5rem); }
header { display:flex; flex-wrap:wrap; align-items:center; gap:1.4rem; padding-block-end:1.4rem; border-block-end:1px solid var(--rule); }
.seal { background:var(--red); color:#fff8ed; font-family:"Kaiti SC",KaiTi,serif; font-size:1.4rem; line-height:1.3; padding:.5rem .65rem; border:3px double var(--paper); }
.heading { flex:1 1 20rem; min-inline-size:0; }
.eyebrow { font-family:system-ui,sans-serif; font-size:.72rem; letter-spacing:.2em; color:var(--soft); margin:0 0 .35rem; }
h1 { font-size:clamp(1.8rem, 1.2rem + 2vw, 3rem); font-weight:500; line-height:1.25; margin:0; text-wrap:balance; }
.subtitle { margin:.4rem 0 0; color:var(--soft); }
.edition { font-size:.8rem; color:var(--soft); }
.intro { max-inline-size:65rem; margin-block:1.1rem; }
.filters { display:flex; flex-wrap:wrap; align-items:center; gap:.55rem; margin-block:1rem; }
button, input, select { font:inherit; }
button { cursor:pointer; min-block-size:44px; }
.filter, .reset { border:1px solid var(--rule); color:var(--ink); background:transparent; padding:.4rem 1rem; border-radius:3px; }
.filter[aria-pressed="true"] { background:var(--ink); color:var(--card); border-color:var(--ink); }
.swatch { display:inline-block; inline-size:.65rem; block-size:.65rem; border-radius:50%; background:var(--element); margin-inline-end:.4rem; }
.reset { margin-inline-start:auto; }
.workspace { display:grid; grid-template-columns:minmax(0, 19rem) minmax(0, 1fr); border:1px solid var(--rule); background:var(--card); }
.sidebar { min-inline-size:0; border-inline-end:1px solid var(--rule); display:flex; flex-direction:column; max-block-size:47rem; }
.search { flex:none; padding:1rem; border-block-end:1px solid var(--rule); }
label { display:block; font-size:.8rem; color:var(--soft); }
input[type="search"] { inline-size:100%; margin-block-start:.4rem; padding:.5rem .6rem; color:var(--ink); border:1px solid var(--rule); background:var(--card); border-radius:0; min-inline-size:0; }
#count { margin:.6rem 0 0; font-size:.8rem; color:var(--soft); }
#regions { min-block-size:0; flex:1; max-block-size:34rem; overflow:auto; overscroll-behavior:contain; scrollbar-gutter:stable; list-style:none; padding:0; margin:0; }
.place { display:flex; gap:.7rem; align-items:start; inline-size:100%; padding:.9rem 1rem; border:0; border-block-end:1px solid #b9a98570; background:transparent; color:var(--ink); text-align:start; }
.place:hover, .place[aria-pressed="true"] { background:#ded1b4; }
.place strong { font-size:.93rem; font-weight:600; }
.place small { display:block; color:var(--soft); font-size:.75rem; }
.number { flex:none; color:var(--element); font-family:system-ui,sans-serif; font-size:.75rem; padding-block-start:.2rem; }
.empty { padding:1rem; }
.search { display:block; }
#search-submit { font:inherit; min-block-size:48px; padding:.4rem 1rem; margin-block-start:.5rem; background:var(--ink); color:var(--paper); border:1px solid var(--rule); cursor:pointer; }
#search-submit:disabled { opacity:.6; cursor:wait; }
#search-help, #search-status, .search-provider { font-size:.75rem; overflow-wrap:anywhere; margin-block:.5rem; }
#search-results { list-style:none; margin:0; padding:0; max-block-size:15rem; overflow:auto; }
#search-results button { min-block-size:48px; text-align:start; overflow-wrap:anywhere; }
#search { font-size:1rem; min-block-size:48px; }

.map-wrap { min-inline-size:0; position:relative; }
#map { block-size:41rem; background:#ddd8ca; font-family:system-ui,sans-serif; }
.map-head { display:flex; justify-content:space-between; padding:.55rem .9rem; font-size:.75rem; border-block-end:1px solid var(--rule); color:var(--soft); }
.map-head b { color:var(--ink); font-weight:500; }
.map-status { margin:0; padding:.6rem 1rem; font-size:.78rem; background:var(--card); border-block-start:1px solid var(--rule); }
.map-status[data-error="true"] { color:var(--red); }
.marker { border:0; background:none; }
.marker span { display:grid; place-items:center; inline-size:36px; block-size:36px; border:2px solid #fff8ed; background:var(--element); color:white; border-radius:50% 50% 50% 5px; transform:rotate(-45deg); box-shadow:0 1px 4px #26211b55; }
.marker em { font:600 14px system-ui,sans-serif; font-style:normal; transform:rotate(45deg); }
.marker.selected span { outline:3px solid var(--ink); outline-offset:2px; }
.leaflet-tooltip { font-family:inherit; }
.leaflet-popup-content { color:#26211b; font:14px/1.65 "Songti SC",serif; }
.leaflet-popup-content h3 { font-size:1rem; margin:0 0 .5rem; }
.leaflet-popup-content p { margin:.5rem 0; }
.leaflet-popup-content .popup-basis { color:#655a49; font-size:.75rem; }
.leaflet-popup-content ul { padding-inline-start:1rem; }
.leaflet-control-attribution { max-inline-size:100%; overflow-wrap:anywhere; }
.detail { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.6fr); gap:2rem; padding:1.5rem 0; border-block-end:1px solid var(--rule); scroll-margin-block-start:1rem; }
.detail > div { min-inline-size:0; }
.detail h2 { font-weight:500; margin:.3rem 0; font-size:1.6rem; }
.detail h3 { font-size:.8rem; color:var(--soft); font-weight:500; margin:0; }
.detail p { margin:.4rem 0 1rem; }
.tag { color:var(--element); font-size:.85rem; }
#coordinate, #sources { font-size:.8rem; }
#sources { padding-inline-start:1.2rem; }
a { color:inherit; text-underline-offset:.2em; overflow-wrap:anywhere; }
a:hover { color:var(--red); }
details { padding-block:1rem; color:var(--soft); font-size:.85rem; }
summary { cursor:pointer; color:var(--ink); }
.method { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr)); gap:1rem; margin-block:1rem; }
.method p { border-inline-start:2px solid var(--rule); padding-inline-start:.8rem; margin:0; }
footer { color:var(--soft); font-size:.75rem; padding-block:1rem; border-block-start:1px solid var(--rule); }
:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
@media (max-width:760px) {
  header { display:grid; grid-template-columns:auto minmax(0,1fr); gap:.4rem 1rem; }
  .seal { grid-row:1 / 3; }
  .edition { grid-column:2; }
  .workspace { grid-template-columns:minmax(0,1fr); }
  .map-wrap { grid-row:1; }
  #map { block-size:58dvh; min-block-size:20rem; }
  .sidebar { max-block-size:none; border-inline-end:0; border-block-start:1px solid var(--rule); }
  #regions { max-block-size:16rem; }
  .detail { grid-template-columns:minmax(0,1fr); gap:.5rem; }
  .reset { margin-inline-start:0; }
}
@media (prefers-color-scheme:dark) {
  :root { color-scheme:dark; --paper:#16120e; --card:#211a14; --ink:#eadcbf; --soft:#c0b296; --rule:#756247; --red:#e28c7f; --gold:#d2a856; }
  .place:hover, .place[aria-pressed="true"] { background:#3b3022; }
  .number, .tag { color:color-mix(in srgb,var(--element) 50%,var(--ink)); }
  .seal { background:#b03a2e; color:#fff8ed; }
  .leaflet-container { color:#26211b; color-scheme:light; }
  .leaflet-container a { color:#194f62; }
}
.controls { display:flex; flex-wrap:wrap; gap:1rem; align-items:center; margin-block:1rem; }
.controls label { display:flex; gap:.5rem; align-items:center; color:var(--ink); }
.controls select { min-block-size:44px; max-inline-size:100%; background:var(--card); color:var(--ink); border:1px solid var(--rule); padding:.4rem; }
.controls input { accent-color:var(--red); inline-size:1.15rem; block-size:1.15rem; margin:0; }
#view-note { font-size:.8rem; color:var(--soft); margin:0 0 1rem; }
.leaflet-tile-pane { filter:grayscale(.85); }
.region-label { inline-size:max-content; background:transparent; color:#26211b; border:0; text-shadow:-1px -1px 2px #fff8ed,1px 1px 2px #fff8ed,0 0 3px #fff8ed; box-shadow:none; padding:2px 5px; font:12px/1.4 "Songti SC",serif; white-space:normal; text-align:center; max-inline-size:11rem; }
.region-label::before { display:none; }
.region-label b { display:block; font-weight:600; }
.region-label small { color:#655a49; }
.detail ul { margin-block:.4rem 1rem; padding-inline-start:1.2rem; }
.detail li { margin-block:.3rem; }
#boundary, #limitations { font-size:.88rem; }
.evidence-link { background:transparent; border:1px solid var(--rule); color:var(--ink); padding:.4rem .65rem; margin:.2rem; text-align:start; }
.leaflet-interactive:focus-visible { outline:3px solid var(--red); }
@media (max-width:760px) { .controls { gap:.5rem; } .filters { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.4rem; } .filter { padding:.3rem; font-size:.85rem; }  .region-label { padding:2px 5px; } .region-label b,.region-label .secondary-caption { display:none; } .region-label .primary-symbol { font-size:14px; font-weight:bold; } }
.coverage { border-inline-start:3px solid var(--red); padding:.4rem .8rem; background:var(--card); font-size:.85rem; }
#confidence { font-size:.85rem; color:var(--soft); }
</style>
</head>
<body>
<main>
  <header>
    <div class="seal" aria-hidden="true">城<br>域</div>
    <div class="heading"><p class="eyebrow">KANYU · REGIONAL ATLAS</p><h1 id="title"></h1><p class="subtitle" id="subtitle"></p></div>
    <div class="edition"><span data-t="edition"></span><br><span id="reviewed"></span></div>
  </header>
  <p class="intro" id="summary"></p><p class="coverage" id="coverage-status" role="status"></p>
  <div class="controls">
    <label for="method"><span data-t="reading"></span> <select id="method"><option value="relative"></option><option value="function"></option><option value="landscape"></option></select></label>
    <label><input type="checkbox" id="show-evidence"><span data-t="showEvidence"></span></label><label><input type="checkbox" id="show-grid"><span data-t="showGrid"></span></label>
    <button class="reset" id="reset" data-t="reset"></button>
  </div>
  <p id="view-note"></p>
  <div class="filters" role="group" data-t-aria="filterAria" id="filters"></div>
  <div class="workspace">
    <aside class="sidebar" data-t-aria="indexAria">
      <search class="search"><form id="search-form" action="#map" method="get" data-t-aria="searchAria">
        <label for="search" data-t="searchLabel"></label><input id="search" name="q" type="search" maxlength="200" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-describedby="search-help search-status">
        <button id="search-submit" type="submit" data-t="locate"></button><p id="search-help"></p><p id="search-status" role="status"></p><ul id="search-results" data-t-aria="candidates"></ul>
        <p class="search-provider"><span data-t="online"></span><span id="postcodes-provider"><a href="https://postcodes.io/" target="_blank" rel="noopener noreferrer">Postcodes.io</a> / </span><a href="https://github.com/komoot/photon" target="_blank" rel="noopener noreferrer">Photon · © OSM</a><span data-t="onlyOnSubmit"></span></p>
      </form><p id="count" role="status"></p></search>
      <ol id="regions"></ol>
    </aside>
    <section class="map-wrap" data-t-aria="mapAria">
      <div class="map-head"><b id="map-head-text"></b><span data-t="north"></span></div>
      <div id="map" data-t-aria="mapLabel"></div>
      <p class="map-status" id="map-status" role="status"></p>
    </section>
  </div>
  <section class="detail" id="detail" aria-labelledby="region-title" tabindex="-1">
    <div><span class="tag" id="tag"></span><h2 id="region-title"></h2><p id="basis"></p><p id="confidence"></p>
      <h3 data-t="whyBoundary"></h3><p id="boundary"></p><ul id="boundary-sources"></ul>
      <h3 data-t="evidenceHead"></h3><div id="evidence"></div>
    </div>
    <div><h3 data-t="whyElement"></h3><p id="reason"></p><h3 data-t="factsHead"></h3><ul id="facts"></ul>
      <h3 data-t="limitsHead"></h3><p id="limitations"></p><h3 data-t="sourcesHead"></h3><ul id="sources"></ul></div>
  </section>
  <details><summary id="method-summary"></summary>
    <div class="method" id="method-elements"></div>
    <p data-t="m1"></p>
    <p data-t="m2"></p>
    <p><b data-t="relDefault"></b><span data-t="m3"></span></p>
    <p data-t="m4"></p>
    <p id="coordinate-note"></p><p data-t="m5"></p>
    <p data-t="m6"></p>
  </details>
  <footer><span data-t="footer"></span><p id="data-attribution"></p><a href="https://www.openstreetmap.org/fixthemap" target="_blank" rel="noopener noreferrer"><span data-t="reportMap"></span></a></footer>
  <noscript>请启用 JavaScript 查看片区地图；原始分析与来源保存在城市 JSON 文件中。 Enable JavaScript to view the map; the analysis and sources are in the city JSON file.</noscript>
</main>

  m1:'Every cell inside the boundary has a main element; secondary elements and low confidence are allowed, instead of picking a few landmarks. A continuous statistical grid is clipped to the real boundary; the cell size is a scale of observation and does not mean the elements change at grid lines. Areas outside the boundary are not covered. Filtering by element hides the other colours for a while; use "Show all cells" to bring them back.',
  m2:'The land-cover base comes from ESA WorldCover 2021: 10 m classes aggregated to 50 m and counted per cell, not a 2026 field survey. Function data for London and Shanghai is an OSM snapshot and may miss things; New York uses official zoning, which shows permitted use rather than current business, so those readings have lower confidence.',

  m3:' · Classical basis (our translation): the Hong Fan 洪范 of the Book of History (Shang Shu 尚书): 「水曰润下，火曰炎上，木曰曲直，金曰从革，土爰稼穑」 "water moistens and descends, fire blazes upward, wood bends and straightens, metal yields and is reshaped, earth receives sowing and harvest"; the Wu Xing Da Yi 五行大义, vol. 1, tells the elements apart by 「体者，以形质为名；性者，以功用为义」 "body is named by form and substance; nature is defined by function", and says Earth 「总于四行」 "unites the other four" and 「土苞四德，故其体能兼虚实」 "embraces the four virtues, so its body holds both the empty and the solid". So Earth is the base that carries the other four, and each cell is read by which element stands out most compared with the rest of the area: each signal becomes a percentile within the area, and the highest one with a signal of at least 0.05 wins. It answers "what stands out here compared with an ordinary place in this city", not "which element makes up most of this place"; in a different comparison area the same place may come out differently.',

};
const LANG=data.lang==='en'?'en':'zh',T=UI[LANG],EL=T.el;
document.querySelectorAll('[data-t]').forEach(n=>{n.textContent=T[n.dataset.t];});
document.querySelectorAll('[data-t-aria]').forEach(n=>{n.setAttribute('aria-label',T[n.dataset.tAria]);});
const colors={'金':'#9b701e','木':'#37754c','水':'#28678b','火':'#b74434','土':'#84603b'};
const methods=T.methods;
const $=id=>document.getElementById(id);
const put=(id,value)=>{$(id).textContent=value;};
const node=(tag,value,cls)=>{const n=document.createElement(tag);if(value!==undefined)n.textContent=value;if(cls)n.className=cls;return n;};
function sourceList(target,sources){target.replaceChildren(...sources.map(s=>{const li=node('li'),a=node('a',s.title+' ↗');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';li.append(a);return li;}));}
const SCOPE=data.scope_label||T.whole;
put('title',T.title(data.city,SCOPE));put('map-head-text',T.mapHead(SCOPE));put('method-summary',T.methodSummary(SCOPE));put('map-status',T.loading);
$('method-elements').replaceChildren(...['水','木','土','金','火'].map(e=>{const p=node('p'),b=node('b',EL(e));p.append(b,T.elements[e]);return p;}));
if(!data.regions.every(r=>r.analyses.relative))$('method').options[0].remove();
for(const o of $('method').options)o.textContent=T.option(SCOPE,o.value);
if((data.search?.country_code||'')!=='gb')$('postcodes-provider').hidden=true;put('subtitle',data.subtitle);put('summary',data.summary);put('reviewed',T.reviewed+data.reviewed_at);put('coordinate-note',data.coordinate_note);
put('coverage-status',T.coverage(data.coverage.name,data.coverage_report.coverage_percent.toFixed(2),data.regions.length));
put('data-attribution',(data.model?.attribution||[]).join(T.attrSep));
const map=L.map('map',{scrollWheelZoom:false});L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);
map.createPane('regionLabels');map.getPane('regionLabels').style.zIndex=450;map.getPane('regionLabels').style.pointerEvents='none';
const regionIndex=new Map(data.regions.map(r=>[r.id,r]));
const searchIndex=new Map(data.regions.map(r=>[r.id,JSON.stringify([r.name,r.analyses]).toLocaleLowerCase()]));
const shapes=new Map(),evidenceLayer=L.layerGroup().addTo(map);
const selectedLabel=L.tooltip({permanent:true,direction:'center',className:'region-label',pane:'regionLabels'});
let active='全部',selected=null;
const methodFor=r=>r.analyses[$('method').value]?$('method').value:r.preferred_method;
const analysis=r=>r.analyses[methodFor(r)];
const caption=a=>EL(a.primary)+T.main+(a.secondary.length?T.secondary+a.secondary.map(EL).join(T.sep):'');
function ringContains(ring,lon,lat){let inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){
 const [xi,yi]=ring[i],[xj,yj]=ring[j];
 const cross=(lon-xi)*(yj-yi)-(lat-yi)*(xj-xi);
 if(Math.abs(cross)<1e-12&&lon>=Math.min(xi,xj)-1e-12&&lon<=Math.max(xi,xj)+1e-12&&lat>=Math.min(yi,yj)-1e-12&&lat<=Math.max(yi,yj)+1e-12)return true;
 if((yi>lat)!==(yj>lat)&&lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)inside=!inside;
 }return inside;}
function contains(geometry,lon,lat){const polys=geometry.type==='Polygon'?[geometry.coordinates]:geometry.coordinates;return polys.some(poly=>ringContains(poly[0],lon,lat)&&!poly.slice(1).some(hole=>ringContains(hole,lon,lat)));}
function coordinateQuery(){const match=$('search').value.trim().match(/^(-?\d+(?:\.\d+)?)\s*[,，]\s*(-?\d+(?:\.\d+)?)$/);return match?[Number(match[2]),Number(match[1])]:null;}
function regionAt(lon,lat){return data.regions.find(r=>shapes.get(r.id).getBounds().contains([lat,lon])&&contains(r.geometry,lon,lat));}
function visible(){if(located)return data.regions.filter(r=>r.id===located&&(active==='全部'||analysis(r).primary===active));const q=$('search').value.trim().toLocaleLowerCase(),coord=coordinateQuery();if(coord){const r=regionAt(...coord);return r?[r]:[];}const matches=data.regions.filter(r=>(active==='全部'||analysis(r).primary===active)&&searchIndex.get(r.id).includes(q));return matches.length||!q?matches:data.regions.filter(r=>active==='全部'||analysis(r).primary===active);}
function fit(regions){if(regions.length)map.fitBounds(L.featureGroup(regions.map(r=>shapes.get(r.id))).getBounds(),{padding:[20,20],maxZoom:15,animate:false});}
function style(r){const a=analysis(r);return {color:r.id===selected?'#26211b':colors[a.primary],fillColor:colors[a.primary],fillOpacity:r.id===selected ? .72 : .52,weight:r.id===selected?2.5:($('show-grid').checked ? .45 : 0),dashArray:null};}
function refreshEvidence(){evidenceLayer.clearLayers();const r=regionIndex.get(selected);if(!$('show-evidence').checked||!r)return;for(const p of r.evidence||[]){const box=node('div');box.append(node('h3',p.name),node('p',p.note));const list=node('ul');sourceList(list,p.sources);box.append(list);L.circleMarker([p.position[1],p.position[0]],{className:'evidence-marker',radius:5,color:'#26211b',fillColor:'#fff8ed',fillOpacity:1,weight:2}).bindPopup(box).addTo(evidenceLayer);}}
function popup(r){const a=analysis(r),box=node('div');box.append(node('h3',r.name),node('p',caption(a)+T.conf(a.confidence)),node('p',a.reason));const button=node('button',T.more,'evidence-link');button.addEventListener('click',()=>{select(r,false);$('detail').focus({preventScroll:true});$('detail').scrollIntoView({block:'start',behavior:'instant'});});box.append(button);return box;}
function select(r,pan=true){
 const previous=selected;selected=r.id;const a=analysis(r);
 put('region-title',r.name);put('tag',caption(a));$('tag').style.setProperty('--element',colors[a.primary]);put('basis',methods[methodFor(r)]+T.unit);put('confidence',T.confNote(a.confidence)+a.confidence_reason);
 put('boundary',r.boundary.description);sourceList($('boundary-sources'),r.boundary.sources);put('reason',a.reason);$('facts').replaceChildren(...a.facts.map(f=>node('li',f)));put('limitations',a.limitations);sourceList($('sources'),a.sources);
 $('evidence').replaceChildren(...(r.evidence||[]).map(p=>{const b=node('button',p.name+' ↗','evidence-link');b.addEventListener('click',()=>{map.setView([p.position[1],p.position[0]],15,{animate:false});const box=node('div');box.append(node('h3',p.name),node('p',p.note));const list=node('ul');sourceList(list,p.sources);box.append(list);L.popup().setLatLng([p.position[1],p.position[0]]).setContent(box).openOn(map);});return b;}));
 if(!(r.evidence||[]).length)$('evidence').append(node('p',T.noEvidence));
 document.querySelectorAll('.region-item[aria-pressed="true"]').forEach(b=>b.setAttribute('aria-pressed','false'));const button=document.querySelector('.region-item[data-id="'+r.id+'"]');if(button)button.setAttribute('aria-pressed','true');
 if(previous&&shapes.has(previous))shapes.get(previous).setStyle(style(regionIndex.get(previous)));shapes.get(r.id).setStyle(style(r));
 selectedLabel.setLatLng([r.label_position[1],r.label_position[0]]).setContent(node('span',caption(a)));if(!map.hasLayer(selectedLabel))selectedLabel.addTo(map);refreshEvidence();if(pan)fit([r]);
}
for(const r of data.regions){const layer=L.geoJSON(r.geometry,{bubblingMouseEvents:false,style:()=>style(r),onEachFeature:(_,path)=>{
 path.on('click',()=>select(r,false));path.on('add',()=>{const el=path.getElement();el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',T.cellAria(r.name));el.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select(r,false);path.openPopup();}};});path.bindPopup(()=>popup(r),{maxWidth:320,maxHeight:260});}});shapes.set(r.id,layer);}
const outline=L.geoJSON(data.coverage.geometry,{interactive:false,style:{color:'#b03a2e',weight:1.5,fill:false}}).addTo(map);
function update(){
 const shown=visible(),shownIds=new Set(shown.map(r=>r.id));map.closePopup();$('regions').replaceChildren();
 for(const r of data.regions){const layer=shapes.get(r.id);if(!shownIds.has(r.id)){if(map.hasLayer(layer))map.removeLayer(layer);continue;}if(!map.hasLayer(layer))layer.addTo(map);layer.setStyle(style(r));
 const li=node('li'),button=node('button',undefined,'place region-item');button.dataset.id=r.id;button.setAttribute('aria-pressed',String(r.id===selected));const a=analysis(r),symbol=node('span',EL(a.primary),'number'),body=node('span');symbol.style.setProperty('--element',colors[a.primary]);body.append(node('strong',r.name),node('small',caption(a)+T.conf(a.confidence)));button.append(symbol,body);button.addEventListener('click',()=>{select(r);$('detail').focus({preventScroll:true});$('detail').scrollIntoView({block:'nearest',behavior:'instant'});});li.append(button);$('regions').append(li);}
 put('count',T.count(shown.length,data.regions.length));
 if(shown.length){const focus=data.coverage.focus,initial=focus?regionAt(focus[0],focus[1]):null;select(shown.find(r=>r.id===selected)||(initial&&shown.includes(initial)?initial:shown[0]),false);}else{selected=null;if(map.hasLayer(selectedLabel))map.removeLayer(selectedLabel);refreshEvidence();$('regions').append(node('li',coordinateQuery()?T.coordOut:T.noMatch,'empty'));for(const id of ['tag','basis','confidence','boundary','reason','limitations'])put(id,'');put('region-title',T.noMatchTitle);for(const id of ['facts','sources','boundary-sources','evidence'])$(id).replaceChildren();}
 document.querySelectorAll('.filter').forEach(b=>{const e=b.dataset.element;b.setAttribute('aria-pressed',String(e===active));const count=data.regions.filter(r=>e==='全部'||analysis(r).primary===e).length;b.querySelector('.filter-text').textContent=(e==='全部'?T.all:EL(e))+' · '+count;});
 put('view-note',(LANG==='zh'?SCOPE:'')+T.viewNote[$('method').value]+T.viewTail);
}
for(const e of ['全部','金','木','水','火','土']){const b=node('button',undefined,'filter');b.dataset.element=e;if(colors[e]){const dot=node('span',undefined,'swatch');dot.style.setProperty('--element',colors[e]);b.append(dot);}b.append(node('span',e==='全部'?T.all:EL(e),'filter-text'));b.addEventListener('click',()=>{active=e;update();fit(visible());});$('filters').append(b);}
const searchConfig=data.search||{};
$('search').placeholder=searchConfig.placeholder||T.placeholder;
put('search-help',(searchConfig.hint||T.hint)+T.hintTail);
const lookup=CitySearch.createLookup();
let searchController=null,searchVersion=0,located=null,locationMarker=null;
function clearLocation(){located=null;if(locationMarker){map.removeLayer(locationMarker);locationMarker=null;}}
function cancelSearch(){searchVersion++;searchController?.abort();searchController=null;$('search-form').removeAttribute('aria-busy');$('search-submit').disabled=false;}
function showLocation(result){
 const r=regionAt(...result.position);if(!r){put('search-status',T.outside);return;}
 clearLocation();located=r.id;active='全部';update();select(r,false);
 const content=node('div');content.append(node('strong',result.label),node('p',result.source+(result.approximate?T.approx:T.exact)));
 locationMarker=L.circleMarker([result.position[1],result.position[0]],{radius:7,color:'#26211b',fillColor:'#fff8ed',fillOpacity:1,weight:2}).addTo(map).bindPopup(content).openPopup();
 map.setView([result.position[1],result.position[0]],14,{animate:false});
 put('search-status',T.located+result.label+T.stop+(result.approximate?T.approxNote:T.exactNote)+T.source+result.source+T.stop);
}
async function submitSearch(){
 const query=$('search').value.trim();cancelSearch();clearLocation();$('search-results').replaceChildren();
 if(!query){update();fit(data.regions);put('search-status',T.enterQuery);return;}
 const coordinate=coordinateQuery();if(coordinate){active='全部';update();fit(visible());put('search-status',regionAt(...coordinate)?T.coordFound:T.coordOut);return;}
 // Exact local region names are available offline; short names may also be
 // resolved online to a more precise neighbourhood or address on submission.
 if(data.regions.some(r=>r.name.toLocaleLowerCase()===query.toLocaleLowerCase())){update();fit(visible());put('search-status',T.localFound);return;}
 const version=searchVersion,controller=new AbortController();searchController=controller;
 $('search-form').setAttribute('aria-busy','true');$('search-submit').disabled=true;put('search-status',T.querying);
 const timeout=setTimeout(()=>controller.abort(),15000);
 try{
  const b=outline.getBounds();
  const results=await lookup(query,{...searchConfig,lang:LANG,bbox:[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]},controller.signal);
  if(version!==searchVersion)return;
  const inside=results.filter(result=>regionAt(...result.position));
  if(!inside.length){put('search-status',results.length?T.resultOut:T.notFound);return;}
  if(inside.length===1){showLocation(inside[0]);return;}
  put('search-status',T.candidatesFound(inside.length));
  for(const result of inside){const li=node('li'),button=node('button',result.label,'evidence-link');button.type='button';button.addEventListener('click',()=>{showLocation(result);});li.append(button);$('search-results').append(li);}
 }catch(error){if(version===searchVersion)put('search-status',error.name==='AbortError'?T.timeout:(error instanceof TypeError?T.offlineSearch:(LANG==='zh'&&error.message)||T.failed));}
 finally{clearTimeout(timeout);if(version===searchVersion){searchController=null;$('search-form').removeAttribute('aria-busy');$('search-submit').disabled=false;}}
}
$('search').addEventListener('input',()=>{cancelSearch();clearLocation();$('search-results').replaceChildren();put('search-status','');if(coordinateQuery())active='全部';update();});
$('search-form').addEventListener('submit',event=>{event.preventDefault();submitSearch();});
$('search').addEventListener('keydown',event=>{if(event.key==='Enter'&&(event.isComposing||event.keyCode===229))event.preventDefault();});
$('method').addEventListener('change',()=>{active='全部';update();fit(visible());});$('show-evidence').addEventListener('change',refreshEvidence);$('show-grid').addEventListener('change',()=>{for(const r of data.regions)shapes.get(r.id).setStyle(style(r));});
$('reset').addEventListener('click',()=>{cancelSearch();clearLocation();$('search-results').replaceChildren();put('search-status','');active='全部';$('search').value='';update();fit(data.regions);});
map.on('click',event=>{const r=regionAt(event.latlng.lng,event.latlng.lat);if(r)select(r,false);});
update();fit(data.regions);
const status=(message,error=false)=>{put('map-status',message);$('map-status').dataset.error=String(error);};
if(location.protocol==='file:'){status(T.http,true);}else{
 const base=data.basemap,link=node('a',base.attribution);link.href=base.attribution_url;link.target='_blank';link.rel='noopener noreferrer';let loaded=0,errors=0;
 L.tileLayer(base.url,{maxZoom:base.max_zoom,attribution:link.outerHTML}).on('loading',()=>{loaded=0;errors=0;status(T.loading);}).on('tileload',()=>loaded++).on('tileerror',()=>{errors++;status(T.tileError,true);}).on('load',()=>{if(!errors&&loaded)status(T.tilesLoaded);}).addTo(map);
 window.addEventListener('offline',()=>status(T.offline,true));
}
