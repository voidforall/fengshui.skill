<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bazi Chart · Female · Gengwu Xinsi Dingyou Jiachen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* 命书：册页上并列四柱，干在上、支在下；柱间以弧线标合冲刑害。下方为大运流年的岁月轴。
   与飞星盘同一套册页配色：浅色宣纸，深色黑漆描金。五行取《五行大义》五色：木青、火赤、土黄、金白、水黑
   （白、黑在纸上难辨，以银灰、玄青代之）。 */
:root {
  --paper: #ece2cb; --paper-2: #e3d6b8; --ink: #26211b; --ink-soft: #5d5446; --rule: #b9a985;
  --cinnabar: #b03a2e; --azurite: #2f5d6e; --gold: #9a7431; --seal-text: #f6efe0;
  --wx-mu: #2f7356; --wx-huo: #b23a2c; --wx-tu: #95701f; --wx-jin: #6f737b; --wx-shui: #1f3a55;
  --font-brush: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", "BiauKai", serif;
  --font-song: "Noto Serif SC", "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
  color-scheme: light;
}
/* 英文页：西文用 Garamond；干支字形（命盘本身）仍用楷体 */
:root[lang="en"] { --font-song: "EB Garamond", "Garamond", "Noto Serif SC", "Songti SC", serif; --font-latin: "EB Garamond", "Garamond", serif; }
:root[lang="en"] body { font-size: 16px; line-height: 1.6; }
:root[lang="en"] h1, :root[lang="en"] h2.sec, :root[lang="en"] h3, :root[lang="en"] .leaf h2, :root[lang="en"] .btn-cast,
:root[lang="en"] .now, :root[lang="en"] .yun-card.pre .gz, :root[lang="en"] .slider-row output, :root[lang="en"] .wx-bars .name,
:root[lang="en"] #tip h4, :root[lang="en"] details.glossary summary, :root[lang="en"] details.glossary h4 { font-family: var(--font-latin); font-weight: 600; letter-spacing: 0; }
:root[lang="en"] .wx-bars .name { font-size: 16px; }
:root[lang="en"] .slider-row output { font-size: 19px; }
:root[lang="en"] details.glossary summary { font-size: 19px; }
:root[lang="en"] h1 { font-size: clamp(30px, 5vw, 44px); }
:root[lang="en"] h2.sec, :root[lang="en"] .leaf h2 { font-size: 25px; }
:root[lang="en"] h3 { font-size: 20px; }
:root[lang="en"] .btn-cast { font-size: 18px; padding: 3px 18px; letter-spacing: .04em; }
:root[lang="en"] .col-label { letter-spacing: 0; }
:root[lang="en"] .hid li { white-space: normal; line-height: 1.25; margin-bottom: 3px; }
:root[lang="en"] .hid span { font-size: 12px; }
.glyph .py { display: block; font-family: var(--font-song); font-size: 12px; line-height: 1.2; color: var(--ink-soft); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16120e; --paper-2: #211a14; --ink: #eadcbf; --ink-soft: #b3a283; --rule: #5a4a33;
    --cinnabar: #d9604f; --azurite: #7fb0bf; --gold: #d2a856; --seal-text: #1b130d;
    --wx-mu: #79c29b; --wx-huo: #e5765f; --wx-tu: #d8b05a; --wx-jin: #e4dfd3; --wx-shui: #8db4dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16120e; --paper-2: #211a14; --ink: #eadcbf; --ink-soft: #b3a283; --rule: #5a4a33;
  --cinnabar: #d9604f; --azurite: #7fb0bf; --gold: #d2a856; --seal-text: #1b130d;
  --wx-mu: #79c29b; --wx-huo: #e5765f; --wx-tu: #d8b05a; --wx-jin: #e4dfd3; --wx-shui: #8db4dc;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  background-image:
    radial-gradient(ellipse at 20% 0%, color-mix(in srgb, var(--gold) 10%, transparent), transparent 60%),
    radial-gradient(ellipse at 100% 100%, color-mix(in srgb, var(--cinnabar) 6%, transparent), transparent 55%);
  color: var(--ink); font-family: var(--font-song); font-size: 15px; line-height: 1.75;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; min-width: 0; }
.wx-木 { color: var(--wx-mu); } .wx-火 { color: var(--wx-huo); } .wx-土 { color: var(--wx-tu); }
.wx-金 { color: var(--wx-jin); } .wx-水 { color: var(--wx-shui); }
.bg-木 { background: var(--wx-mu); } .bg-火 { background: var(--wx-huo); } .bg-土 { background: var(--wx-tu); }
.bg-金 { background: var(--wx-jin); } .bg-水 { background: var(--wx-shui); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* 题签 */
header.title { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 18px; }
.seal { width: 64px; height: 64px; flex: none; margin-top: 6px; }
.seal rect { fill: var(--cinnabar); }
.seal text { fill: var(--seal-text); font-family: var(--font-brush); font-size: 21px; text-anchor: middle; dominant-baseline: central; }
.title-text { min-width: 0; flex: 1 1 320px; }
h1 { font-family: var(--font-brush); font-weight: 400; font-size: clamp(34px, 6vw, 52px); line-height: 1.1; margin: 0; letter-spacing: .04em; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 8px 0 0; padding: 0; list-style: none; color: var(--ink-soft); font-size: 14px; }
.facts b { color: var(--ink); font-weight: 600; }
.warn { color: var(--cinnabar); font-size: 14px; margin: 6px 0 0; }
.time-lines { margin: 6px 0 0; color: var(--ink-soft); font-size: 13px; }
.time-lines summary { cursor: pointer; width: fit-content; }
.time-lines p { margin: 2px 0; }

h2.sec, h3 { font-family: var(--font-brush); font-weight: 400; }
h2.sec { font-size: 28px; margin: 0 0 8px; line-height: 1.3; }
h3 { font-size: 22px; margin: 0 0 6px; line-height: 1.3; }

/* 版心：左命盘、右批注 */
.board-wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .board-wrap { grid-template-columns: minmax(0, 1fr); } }
.plate { display: grid; gap: 10px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.chip { font: inherit; font-size: 14px; color: var(--ink-soft); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-soft); background: var(--paper-2); }
.btn-cast { font-family: var(--font-brush); font-size: 22px; color: var(--seal-text); background: var(--cinnabar); border: 0; border-radius: 4px; padding: 2px 22px; cursor: pointer; letter-spacing: .2em; }
.btn-cast:hover { filter: brightness(1.08); }

.chart { display: grid; gap: 0; }
.band { width: 100%; height: auto; display: block; overflow: visible; }
.band .arc { fill: none; stroke-width: 1.6; cursor: pointer; }
.band .arc.he { stroke: var(--gold); }
.band .arc.chong { stroke: var(--cinnabar); stroke-width: 2; }
.band .arc.xing, .band .arc.hai { stroke: var(--cinnabar); stroke-dasharray: 5 4; }
.band .arc.que { stroke: var(--rule); stroke-dasharray: 2 4; }
.band .arc.on { stroke-width: 3.2; }
.band g { outline: none; }
.band g:focus-visible .arc { stroke-width: 3.2; filter: drop-shadow(0 0 2px var(--gold)); }
.band .hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
.band text { font-family: var(--font-song); font-size: 13px; fill: var(--ink-soft); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.band text.lab-bg { stroke: var(--paper); stroke-width: 5px; paint-order: stroke; }
.band.off { display: none; }

.cols { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 8px; }
.col { background: var(--paper-2); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 4px 10px; text-align: center; display: grid; gap: 2px; justify-items: center; align-content: start; min-width: 0;
       transform-origin: 50% 50%; transition: transform .55s cubic-bezier(.2,.7,.2,1), opacity .55s; }
.col.day { border-color: var(--cinnabar); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cinnabar) 40%, transparent); }
.col.flip { transform: perspective(600px) rotateY(88deg); opacity: 0; }
.col-label { font-size: 13px; color: var(--ink-soft); letter-spacing: .1em; }
.ss { font-size: 13px; color: var(--ink-soft); min-height: 1.6em; }
.col.day .ss { color: var(--cinnabar); }
.glyph { font-family: var(--font-brush); font-size: clamp(40px, 9vw, 62px); line-height: 1.1; background: transparent; border: 0; border-radius: 4px; padding: 0 6px; cursor: pointer; }
.glyph:hover { background: color-mix(in srgb, var(--gold) 12%, transparent); }
.glyph.sel { background: color-mix(in srgb, var(--gold) 24%, transparent); box-shadow: 0 0 0 1.5px var(--gold); }
.glyph.lit { text-shadow: 0 0 0.5px currentColor; background: color-mix(in srgb, var(--gold) 16%, transparent); }
.hid { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 0; font-size: 13px; line-height: 1.5; }
.hid li { white-space: nowrap; }
.hid b { font-family: var(--font-brush); font-weight: 400; font-size: 18px; margin-right: 3px; }
.hid span { color: var(--ink-soft); }
.hid.off { display: none; }
.meta { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
.tag { display: inline-block; font-size: 11px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; margin: 1px; color: var(--ink-soft); white-space: nowrap; }
.tag.kong { border-color: var(--cinnabar); color: var(--cinnabar); }
.legend-line { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; font-size: 12px; color: var(--ink-soft); margin: 2px 0 0; }
.legend-line i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: 3px; margin-right: 4px; }
.legend-line .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
@media (max-width: 420px) { .hid { font-size: 12px; } .hid b { font-size: 16px; } .hid span.qi { display: none; } .tag .g { display: block; margin-left: 0; } .tag { white-space: normal; } }

/* 批注栏 */
aside.notes { display: grid; gap: 18px; min-width: 0; }
.leaf { border-left: 3px solid var(--cinnabar); padding: 2px 0 2px 16px; min-width: 0; }
.leaf h2 { font-family: var(--font-brush); font-weight: 400; font-size: 28px; margin: 0; line-height: 1.3; }
.leaf .sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 6px; }
.leaf ul.facts-list { margin: 6px 0; padding-left: 1.2em; }
.leaf ul.facts-list li { margin: 2px 0; }
.note { margin: 8px 0 0; white-space: pre-wrap; }
.note.empty { color: var(--ink-soft); font-size: 14px; }
.advice { margin: 6px 0 0; padding-left: 1.3em; }

/* 岁月轴 */
section.yun { display: grid; gap: 12px; min-width: 0; }
.track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(84px, 1fr); gap: 6px; overflow-x: auto; padding: 4px 2px 8px; scroll-snap-type: x proximity; }
.yun-card { font: inherit; background: var(--paper-2); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 4px; cursor: pointer; text-align: center; scroll-snap-align: start; position: relative; }
.yun-card .gz { font-family: var(--font-brush); font-size: 28px; line-height: 1.15; display: block; }
.yun-card .y { font-size: 12px; color: var(--ink-soft); display: block; }
.yun-card[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1.5px var(--gold); }
.yun-card.pre .gz { font-size: 20px; color: var(--ink-soft); }
.now { position: absolute; top: -8px; right: -4px; font-family: var(--font-brush); font-size: 14px; color: var(--seal-text); background: var(--cinnabar); border-radius: 3px; padding: 0 5px; line-height: 1.5; }
.slider-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.slider-row input[type=range] { flex: 1 1 240px; accent-color: var(--cinnabar); min-width: 0; }
.slider-row output { font-family: var(--font-brush); font-size: 22px; min-width: 9em; }
.years { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
@media (max-width: 640px) { .years { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.year { font: inherit; background: transparent; color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; padding: 2px 0; cursor: pointer; text-align: center; position: relative; }
.year .gz { font-family: var(--font-brush); font-size: 20px; display: block; line-height: 1.2; }
.year .y { font-size: 11px; color: var(--ink-soft); display: block; }
.year[aria-pressed="true"] { background: var(--paper-2); border-color: var(--gold); box-shadow: inset 0 0 0 1.5px var(--gold); }
.year.has-rel::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--cinnabar); }
.year.has-note::before { content: ""; position: absolute; top: 3px; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
.yun-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 700px) { .yun-detail { grid-template-columns: minmax(0, 1fr); } }

/* 下栏 */
.lower { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .lower { grid-template-columns: minmax(0, 1fr); } }
blockquote { margin: 8px 0; padding: 8px 14px; border-left: 3px solid var(--gold); background: color-mix(in srgb, var(--paper-2) 70%, transparent); font-size: 15px; }
blockquote .k { display: inline-block; font-size: 12px; color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; margin-right: 6px; }
.src { font-size: 13px; color: var(--ink-soft); margin: 4px 0 0; }
.src a { color: inherit; }
.wx-bars { margin-top: 4px; display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); gap: 4px 10px; align-items: center; font-size: 13px; }
.wx-bars .h { color: var(--ink-soft); font-size: 12px; }
.wx-bars .name { font-family: var(--font-brush); font-size: 20px; line-height: 1; }
.bar { height: 12px; display: flex; align-items: center; gap: 6px; }
.bar span.fill { display: inline-block; height: 10px; border-radius: 2px; min-width: 2px; }
.bar span.n { font-size: 12px; color: var(--ink-soft); }
.siling { display: flex; gap: 4px; margin: 6px 0; }
.siling div { border: 1px solid var(--rule); border-radius: 3px; padding: 2px 6px; font-size: 13px; text-align: center; color: var(--ink-soft); }
.siling div.on { border-color: var(--gold); color: var(--ink); background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--gold); }
#wx, #shensha { margin-top: 20px; }
.ss-list { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 4px; font-size: 14px; }
.ss-list b { font-weight: 600; }

/* 白话：一眼看懂、术语按钮、释义卡、术语表 */
section.plain { display: grid; gap: 12px; }
.plain-lead { font-size: 17px; line-height: 1.85; margin: 0; padding: 12px 16px; border-left: 3px solid var(--gold); background: color-mix(in srgb, var(--paper-2) 70%, transparent); }
.plain-lead p { margin: 0 0 8px; } .plain-lead p:last-child { margin: 0; }
.plain-lead.empty { font-size: 14px; color: var(--ink-soft); }
.plain-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.pcard { background: var(--paper-2); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px; min-width: 0; }
.pcard h3 { font-size: 20px; margin: 0 0 4px; }
.pcard p { margin: 4px 0; }
.pcard .big { font-family: var(--font-brush); font-size: 52px; line-height: 1; float: left; margin: 2px 12px 0 0; }
.pcard .q { color: var(--ink-soft); font-size: 14px; }
.pcard .hint { color: var(--ink-soft); font-size: 13px; }
.term { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: help; border-bottom: 1px dotted currentColor; text-underline-offset: 3px; }
.term:hover { color: var(--gold); }
.qmark { font: inherit; font-size: 13px; color: var(--ink-soft); background: none; border: 1px solid var(--rule); border-radius: 50%; width: 1.6em; height: 1.6em; line-height: 1.4; padding: 0; margin-left: 8px; cursor: help; vertical-align: 4px; font-family: var(--font-song); }
.gloss { font-size: 12px; color: var(--gold); line-height: 1.2; min-height: 1.2em; }
.plain-off .gloss, .plain-off .tag .g { display: none; }
.tag .g { color: var(--gold); margin-left: 2px; }
#tip { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); background: var(--paper-2); color: var(--ink); border: 1px solid var(--gold); border-radius: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.25); padding: 12px 40px 12px 16px; z-index: 10; }
#tip[hidden] { display: none; }
#tip h4 { font-family: var(--font-brush); font-weight: 400; font-size: 22px; margin: 0 0 2px; }
#tip p { margin: 4px 0; }
#tip .basis { font-size: 12px; color: var(--ink-soft); }
#tip button.x { position: absolute; top: 6px; right: 8px; font-size: 20px; background: none; border: 0; color: var(--ink-soft); cursor: pointer; }
details.glossary summary { cursor: pointer; font-family: var(--font-brush); font-size: 22px; }
details.glossary dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 10px 0 0; font-size: 14px; }
details.glossary dt { font-weight: 600; }
details.glossary dd { margin: 0; }
details.glossary dd .basis { color: var(--ink-soft); font-size: 12px; }
:root[lang="en"] details.glossary dl { grid-template-columns: minmax(0, 16em) minmax(0, 1fr); }
@media (max-width: 560px) { :root[lang="en"] details.glossary dl { grid-template-columns: minmax(0, 1fr); } :root[lang="en"] details.glossary dd { margin-bottom: 8px; } }
details.glossary h4 { grid-column: 1 / -1; margin: 10px 0 0; font-family: var(--font-brush); font-weight: 400; font-size: 18px; }
.why { margin: 6px 0 0; padding-left: 1.2em; font-size: 13px; color: var(--ink-soft); }

footer { border-top: 1px solid var(--rule); padding-top: 14px; color: var(--ink-soft); font-size: 13px; display: grid; gap: 4px; }
footer p { margin: 0; }
@media (prefers-reduced-motion: reduce) { .col { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <header class="title">
    <svg class="seal" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="2" y="2" width="60" height="60" rx="5"></rect>
      <text x="45" y="20">堪</text><text x="45" y="44">輿</text>
      <text x="19" y="20">子</text><text x="19" y="44">印</text>
    </svg>
    <div class="title-text">
      <h1 id="title"></h1>
      <ul class="facts" id="facts"></ul>
      <div id="warnings"></div>
      <details class="time-lines" id="time-lines"><summary data-t="method"></summary></details>
    </div>
  </header>

  <section class="plain" aria-labelledby="plain-title">
    <h2 class="sec" id="plain-title" data-t="plainTitle"></h2>
    <div class="plain-lead" id="plain-lead"></div>
    <div class="plain-grid" id="plain-grid"></div>
  </section>

  <div class="board-wrap">
    <div class="plate">
      <div class="toolbar" role="group" id="toolbar">
        <button class="btn-cast" id="cast" type="button" data-t="cast"></button>
        <button class="chip" type="button" data-toggle="plain" aria-pressed="true" data-t="tPlain"></button>
        <button class="chip" type="button" data-toggle="rel" aria-pressed="true" data-t="tRel"></button>
        <button class="chip" type="button" data-toggle="hid" aria-pressed="true" data-t="tHid"></button>
      </div>
      <div class="chart" id="chart">
        <svg class="band" id="band-gan" role="img"></svg>
        <div class="cols" id="cols"></div>
        <svg class="band" id="band-zhi" role="img"></svg>
      </div>
      <div class="legend-line" id="legend"></div>
    </div>
    <aside class="notes" aria-live="polite">
      <div class="leaf" id="detail"></div>
    </aside>
  </div>

  <section class="yun" aria-labelledby="yun-title">
    <h2 class="sec" id="yun-title" data-t="yunTitle"></h2>
    <div class="track" id="track" role="group"></div>

    p.hidden.forEach(function (x) {
      var li = h("li", null, null, ul);
      h("b", "wx-" + x.wx, x.gan, li); var sp = h("span", null, nm(x.ss), li); sp.title = nm(x.ss) + T.sep + G.shishen[x.ss][2];
    });
    var meta = h("div", "meta", null, c);
    var t1 = h("span", "tag", null, meta); term(nm(p.changsheng), p.changsheng, t1); h("span", "g", T.csGloss(p.changsheng), t1);
    var t2 = h("span", "tag", null, meta); term(nm(p.nayin), "纳音", t2);
    if (D.pillars[2] && D.pillars[2].xunkong.indexOf(p.zhi) >= 0 && p.name !== "日") { var t3 = h("span", "tag kong", null, meta); term(nm("空亡"), "空亡", t3); }
  });

  /* ---- 合冲刑害弧线 ---- */
  var KIND = { "合": "he", "六合": "he", "三合": "he", "三会": "he", "冲": "chong", "刑": "xing", "自刑": "xing", "害": "hai", "三合缺一": "que" };
  var arcs = [];
  function xOf(i) { return (i + 0.5) * 400 / N; }
  function drawBand(svgId, rels, up) {
    var svg = document.getElementById(svgId);
    svg.textContent = "";
    if (!rels.length) { svg.setAttribute("viewBox", "0 0 400 6"); return; }
    var levels = [];
    var items = rels.map(function (r) {
      var a = Math.min.apply(null, r.at), b = Math.max.apply(null, r.at);
      var lv = 0;
      while ((levels[lv] || []).some(function (q) { return !(b < q[0] || a > q[1]) ; })) lv++;
      (levels[lv] = levels[lv] || []).push([a, b]);
      return { r: r, a: a, b: b, lv: lv };
    });
    var H = 22 + levels.length * 22;
    svg.setAttribute("viewBox", "0 0 400 " + H);
    items.forEach(function (it) {
      var cls = KIND[it.r.kind] || "he";
      var base = up ? H - 2 : 2, peak = up ? H - 18 - it.lv * 22 : 18 + it.lv * 22;
      var d;
      if (it.r.at.length >= 3 || it.a === it.b) {
        d = "M" + xOf(it.a) + "," + base + " L" + xOf(it.a) + "," + peak + " L" + xOf(it.b) + "," + peak + " L" + xOf(it.b) + "," + base;
        it.r.at.slice(1, -1).forEach(function (m) { d += " M" + xOf(m) + "," + peak + " L" + xOf(m) + "," + base; });
      } else {
        var x1 = xOf(it.a), x2 = xOf(it.b);
        d = "M" + x1 + "," + base + " C" + x1 + "," + peak + " " + x2 + "," + peak + " " + x2 + "," + base;
      }
      var g = s("g", { tabindex: "0", role: "button", "aria-label": it.r.label }, null, svg);
      var path = s("path", { d: d, "class": "arc " + cls }, null, g);
      s("path", { d: d, "class": "hit" }, null, g);
      var lx = (xOf(it.a) + xOf(it.b)) / 2, ly = up ? peak - 0 : peak;
      var name = it.r.short;
      s("text", { x: lx, y: ly + (up ? -7 : 7), "class": "lab-bg" }, name, g);
      s("text", { x: lx, y: ly + (up ? -7 : 7) }, name, g);
      var rec = { r: it.r, path: path, side: up ? "干" : "支" };
      arcs.push(rec);
      function act() { showRelation(rec); }
      g.addEventListener("click", act);
      g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
    });
  }
  drawBand("band-gan", D.relations.gan, true);
  drawBand("band-zhi", D.relations.zhi, false);
  var lg = document.getElementById("legend");
  WXS.forEach(function (w) {
    var sp = h("span", null, null, lg); h("span", "dot bg-" + w, null, sp); txt(sp, nm(w));
  });
  var KSTYLE = { he: ["var(--gold)", ""], chong: ["var(--cinnabar)", ""], xing: ["var(--cinnabar)", "dashed"], que: ["var(--rule)", "dotted"] };
  T.kinds.forEach(function (k) {
    var sp = h("span", null, null, lg); var i = h("i", null, null, sp);
    i.style.borderTopColor = KSTYLE[k[0]][0]; if (KSTYLE[k[0]][1]) i.style.borderTopStyle = KSTYLE[k[0]][1];
    txt(sp, k[1]);
  });

  /* ---- 批注 ---- */
  var detail = document.getElementById("detail");
  function clearSel() {
    Object.keys(glyphs).forEach(function (k) { glyphs[k].classList.remove("sel", "lit"); });
    arcs.forEach(function (a) { a.path.classList.remove("on"); });
  }
  function relList(pos) {
    var side = pos.slice(1);
    var rels = (side === "干" ? D.relations.gan : D.relations.zhi);
    var idx = "年月日时".indexOf(pos[0]);
    return rels.filter(function (r) { return r.at.indexOf(idx) >= 0; });
  }
  function pillarNote(box, name) {
    var note = (notes.pillars || {})[name];
    h("p", note ? "note" : "note empty", note || T.emptyPillar, box);
  }
  function item(ul, key, value) {
    var li = h("li", null, null, ul); term(nm(key), key, li); txt(li, T.sep + value); return li;
  }
  function pick(i, side) {
    clearSel();
    var p = D.pillars[i], pos = p.name + (side === "gan" ? "干" : "支");
    glyphs[pos].classList.add("sel");
    detail.textContent = "";
    var ul;
    if (side === "gan") {
      var t = h("h2", null, null, detail);
      txt(t, T.pos(p.name, "干") + " ");
      wxSpan(p.gan, p.gan_wx, t);
      if (EN) txt(t, " " + nm(p.gan));
      h("p", "sub", T.ganSub(p), detail);
      h("p", "note", T.ganNote(p), detail);
      ul = h("ul", "facts-list", null, detail);
      item(ul, "通根", T.roots(p.roots));
      var from = [];
      D.pillars.forEach(function (q) { q.tou.forEach(function (t) { if (t.at.indexOf(p.name) >= 0) from.push({ p: q.name, zhi: q.zhi, qi: t.qi, hidden: t.hidden }); }); });
      if (from.length) item(ul, "透干", T.touFrom(from));
      p.roots.forEach(function (r) { glyphs[r.pillar + "支"].classList.add("lit"); });
    } else {
      var t2 = h("h2", null, null, detail);
      txt(t2, T.pos(p.name, "支") + " ");
      wxSpan(p.zhi, p.zhi_wx, t2);
      if (EN) txt(t2, " " + nm(p.zhi));
      h("p", "sub", T.zhiSub(p), detail);
      ul = h("ul", "facts-list", null, detail);
      item(ul, "藏干", p.hidden.map(T.hidden).join(T.hiddenSep));
      if (p.tou.length) {
        item(ul, "透干", p.tou.map(T.touTo).join(T.semi));
        p.tou.forEach(function (t) { t.at.forEach(function (a) { glyphs[a + "干"].classList.add("lit"); }); });
      }
      if (p.name === "月") item(ul, "月令", T.monthCmd());
      if (p.shensha.length) { var li = h("li", null, T.shenshaHere, ul); p.shensha.forEach(function (n, k) { if (k) txt(li, T.list); term(nm(n), n, li); }); }
      if (D.pillars[2] && D.pillars[2].xunkong.indexOf(p.zhi) >= 0 && p.name !== "日") item(ul, "空亡", T.kong());
    }
    var rs = relList(pos);
    if (rs.length) { h("li", null, T.relsHere + rs.map(function (r) { return r.label; }).join(T.semi), ul); whyTerms(rs, detail); }
    rs.forEach(function (r) {
      arcs.forEach(function (a) { if (a.r === r) a.path.classList.add("on"); });
      r.at.forEach(function (k) { var g = glyphs["年月日时"[k] + pos.slice(1)]; if (g && g !== glyphs[pos]) g.classList.add("lit"); });
    });
    pillarNote(detail, p.name);
  }
  function whyTerms(rs, parent) {   // 原局关系带 kind，直接按种类列术语
    var ks = [];
    rs.forEach(function (r) { var k = KIND_TERM[r.kind]; if (k && ks.indexOf(k) < 0) ks.push(k); });
    if (!ks.length) return;
    var ul = h("ul", "why", null, parent);
    ks.forEach(function (k) { var li = h("li", null, null, ul); term(nm(k), k, li); txt(li, T.sep + G.terms[k][0]); });
  }
  function showRelation(rec) {
    clearSel();
    rec.path.classList.add("on");
    rec.r.at.forEach(function (k) { glyphs["年月日时"[k] + rec.side].classList.add("lit"); });
    detail.textContent = "";
    h("h2", null, T.relTitle(rec.r.kind), detail);
    h("p", "sub", rec.r.label, detail);
    var e = G.terms[KIND_TERM[rec.r.kind]];
    h("p", "note", e[0], detail);
    h("p", "sub", T.basis + e[1], detail);
  }

  /* ---- 显示切换 ---- */
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-toggle]"), function (b) {
    b.addEventListener("click", function () {
      var on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", String(on));
      var k = b.getAttribute("data-toggle");
      if (k === "rel") ["band-gan", "band-zhi"].forEach(function (id) { document.getElementById(id).classList.toggle("off", !on); });
      if (k === "hid") Array.prototype.forEach.call(document.querySelectorAll(".hid"), function (u) { u.classList.toggle("off", !on); });
      if (k === "plain") document.body.classList.toggle("plain-off", !on);
    });
  });

  /* ---- 排盘：四柱依次翻开 ---- */
  var timers = [];
  function cast() {
    timers.forEach(clearTimeout); timers = [];
    if (reduce) return;
    colEls.forEach(function (c) { c.classList.add("flip"); });
    ["band-gan", "band-zhi"].forEach(function (id) { document.getElementById(id).style.opacity = 0; });
    colEls.forEach(function (c, i) { timers.push(setTimeout(function () { c.classList.remove("flip"); }, 250 + i * 380)); });
    timers.push(setTimeout(function () {
      ["band-gan", "band-zhi"].forEach(function (id) { var e = document.getElementById(id); e.style.transition = "opacity .5s"; e.style.opacity = 1; });
    }, 250 + N * 380 + 200));
  }
  document.getElementById("cast").addEventListener("click", cast);

  /* ---- 大运流年 ---- */
  var track = document.getElementById("track"), yearsBox = document.getElementById("years");
  var slider = document.getElementById("slider"), out = document.getElementById("slider-out");
  var spans = [];   // {label, gz|null, years: [...] , card}
  if (D.pre_years.length) spans.push({ pre: true, gz: null, years: D.pre_years, start: D.birth_year + "" });
  D.dayun.forEach(function (d) { spans.push({ pre: false, gz: d.gz, years: d.years, d: d }); });
  var lastYear = spans[spans.length - 1].years.slice(-1)[0].year;
  slider.min = D.birth_year; slider.max = lastYear; slider.step = 1;
  spans.forEach(function (sp, k) {
    var b = h("button", "yun-card" + (sp.pre ? " pre" : ""), null, track);
    b.type = "button";
    var gz = h("span", "gz", null, b);
    if (sp.pre) gz.textContent = T.pre; else { wxSpan(sp.gz[0], WX_OF[sp.gz[0]], gz); wxSpan(sp.gz[1], WX_OF[sp.gz[1]], gz); if (EN) h("span", "y", gzName(sp.gz), b); }
    h("span", "y", sp.pre ? sp.start + "–" + (sp.years.slice(-1)[0].year) : sp.d.start_year + " · " + sp.d.age_short, b);
    if (!sp.pre) { h("span", "y", nm(sp.d.gan_ss) + " / " + nm(sp.d.zhi_ss), b); h("span", "gloss", ssShort(sp.d.gan_ss) + " / " + ssShort(sp.d.zhi_ss), b); }
    if (sp.years.some(function (y) { return y.year === D.today_year; })) h("span", "now", T.now, b);
    b.addEventListener("click", function () {
      var y = sp.years.some(function (x) { return x.year === cur; }) ? cur : (sp.years.some(function (x) { return x.year === D.today_year; }) ? D.today_year : sp.years[0].year);
      setYear(y);
    });
    sp.card = b;
  });
  var cur = null;
  function spanOf(y) { for (var k = 0; k < spans.length; k++) if (spans[k].years.some(function (x) { return x.year === y; })) return spans[k]; return spans[0]; }
  function setYear(y) {
    y = Math.max(D.birth_year, Math.min(lastYear, y));
    cur = y; slider.value = y;
    var sp = spanOf(y), yr = sp.years.filter(function (x) { return x.year === y; })[0];
    spans.forEach(function (q) { q.card.setAttribute("aria-pressed", String(q === sp)); });
    out.textContent = T.sliderOut(y, yr);
    yearsBox.textContent = "";
    sp.years.forEach(function (x) {
      var b = h("button", "year" + (x.relations.length ? " has-rel" : "") + ((notes.years || {})[x.year] ? " has-note" : ""), null, yearsBox);
      b.type = "button"; b.setAttribute("aria-pressed", String(x.year === y));
      b.setAttribute("aria-label", T.yearAria(x));
      var g2 = h("span", "gz", null, b); wxSpan(x.gz[0], WX_OF[x.gz[0]], g2); wxSpan(x.gz[1], WX_OF[x.gz[1]], g2);
      h("span", "y", x.year + (x.year === D.today_year ? " " + T.now : ""), b);
      b.addEventListener("click", function () { setYear(x.year); });
    });
    var dd = document.getElementById("dayun-detail"); dd.textContent = "";
    if (sp.pre) {
      h("h3", null, T.pre, dd);
      h("p", "sub", T.preSub, dd);
    } else {
      var t = h("h3", null, null, dd); txt(t, T.dayunHead); gzSpans(sp.gz, t);
      h("p", "sub", T.dayunSub(sp.d), dd);
      T.dayunPlain(sp.gz, sp.d, h("p", "note", null, dd));
      var ul = h("ul", "facts-list", null, dd);
      (sp.d.relations.length ? sp.d.relations : [T.noRel]).forEach(function (r) { h("li", null, r, ul); });
      whyList(sp.d.relations, dd);
      var n1 = (notes.dayun || {})[sp.gz];
      h("p", n1 ? "note" : "note empty", n1 || T.emptyDayun, dd);
    }
    var yd = document.getElementById("year-detail"); yd.textContent = "";
    var t2 = h("h3", null, null, yd); txt(t2, T.yearHead(y)); gzSpans(yr.gz, t2);
    h("p", "sub", T.yearSub(yr), yd);
    T.yearPlain(yr, h("p", "note", null, yd));
    var ul2 = h("ul", "facts-list", null, yd);
    (yr.relations.length ? yr.relations : [T.noRel]).forEach(function (r) { h("li", null, r, ul2); });
    whyList(yr.relations, yd);
    var n2 = (notes.years || {})[y];
    h("p", n2 ? "note" : "note empty", n2 || T.emptyYear, yd);
  }
  slider.addEventListener("input", function () { setYear(parseInt(slider.value, 10)); });
  setYear(D.focus_year >= D.birth_year && D.focus_year <= lastYear ? D.focus_year : D.birth_year);
  (function () { var c = spanOf(cur).card; if (c && c.scrollIntoView && track.scrollWidth > track.clientWidth) track.scrollLeft = c.offsetLeft - track.offsetLeft - 8; })();

  qmark("大运", document.getElementById("yun-title"));
  qmark("调候", document.getElementById("th-title"));

  /* ---- 调候 ---- */
  var th = document.getElementById("tiaohou");
  h("p", "sub", T.thSub(), th);
  D.tiaohou.passages.forEach(function (q) {
    var bq = h("blockquote", null, null, th);
    if (EN) bq.setAttribute("lang", "zh-Hans");
    h("span", "k", T.thKind(q.kind), bq); txt(bq, q.text);
  });
  h("p", "src", T.thSrc, th);

  /* ---- 月令、五行、神煞 ---- */
  var sl = document.getElementById("siling");
  var slh = h("h3", null, T.slHead(), sl); qmark("司令", slh);
  h("p", "note", T.slNote(), sl);
  h("p", "sub", T.slSub(), sl);
  var row = h("div", "siling", null, sl);
  D.siling.table.forEach(function (t) { h("div", T.slOn(t) ? "on" : "", T.slCell(t), row); });

  var wx = document.getElementById("wx");
  qmark("五行个数", h("h3", null, T.wxHead, wx));
  h("p", "sub", T.wxSub, wx);
  var grid = h("div", "wx-bars", null, wx);
  h("span", "h", "", grid); T.wxCols().forEach(function (c) { h("span", "h", c, grid); });
  var maxv = 0; WXS.forEach(function (k) { maxv = Math.max(maxv, D.wuxing.count[k], D.wuxing.hidden[k]); });
  WXS.forEach(function (k) {
    h("span", "name wx-" + k, nm(k), grid);
    [D.wuxing.count[k], D.wuxing.hidden[k]].forEach(function (v) {
      var bar = h("span", "bar", null, grid);
      var f = h("span", "fill bg-" + k, null, bar); f.style.width = (v ? (v / maxv * 100) : 0) * 0.8 + "%";
      if (!v) f.style.opacity = .25;
      h("span", "n", v, bar);
    });
  });

  var ss = document.getElementById("shensha");
  h("h3", null, T.ssHead, ss);
  if (!D.shensha.length) h("p", "sub", T.ssNone, ss);
  else {
    var ul3 = h("ul", "ss-list", null, ss);
    D.shensha.forEach(function (x) {
      var li = h("li", null, null, ul3); term(T.ssLabel(x), x.name, h("b", null, null, li));
      txt(li, T.ssItem(x));
      var ex = explain(x.name); if (ex) h("span", "q", (EN ? " " : "") + ex.text, li).style.color = "var(--ink-soft)";
    });
  }
  h("p", "src", T.ssSrc, ss);

  /* ---- 盘断 ---- */
  var ov = document.getElementById("overall");
  h("h3", null, T.overall, ov);
  if (notes.basis) h("p", "sub", T.basisOf + notes.basis, ov);
  if (notes.summary) h("p", "note", notes.summary, ov);
  if (notes.advice && notes.advice.length) { var ua = h("ul", "advice", null, ov); notes.advice.forEach(function (a) { h("li", null, a, ua); }); }
  if (!notes.summary && !(notes.advice || []).length) h("p", "note empty", T.overallEmpty, ov);
  document.getElementById("source").textContent = D.source;

  /* ---- 一眼看懂 ---- */
  var lead = document.getElementById("plain-lead");
  if (notes.plain) notes.plain.split(/\n+/).forEach(function (t) { if (t.trim()) h("p", null, t, lead); });
  else { lead.textContent = T.leadEmpty; lead.classList.add("empty"); }
  var pg = document.getElementById("plain-grid");
  function card(title) { var c = h("div", "pcard", null, pg); h("h3", null, title, c); return c; }
  var c1 = card(T.c1);
  wxSpan(D.day_gan, D.day_wx, c1, "big");
  T.c1p(h("p", null, null, c1));
  h("p", "q", T.c1q(), c1);
  h("p", "hint", T.c1h, c1);

  var w = D.wangxiang, c2 = card(T.c2);
  T.c2p(w, h("p", null, null, c2));
  h("p", "hint", T.c2h, c2);

  var c3 = card(T.c3);
  var zero = WXS.filter(function (k) { return !D.wuxing.count[k]; });
  h("p", null, T.c3p(), c3);
  h("p", "hint", T.c3h(zero), c3);

  var fy = D.focus_year, fsp = null, fyr = null;
  spans.forEach(function (q) { q.years.forEach(function (x) { if (x.year === fy) { fsp = q; fyr = x; } }); });
  if (fyr) {
    var c4 = card(T.c4(fy));
    var p4 = h("p", null, null, c4);
    if (fsp.pre) txt(p4, T.c4pre()); else T.c4yun(fsp, p4);
    T.c4year(fy, fyr, h("p", null, null, c4));
    h("p", "hint", T.c4h, c4);
  }

  /* ---- 术语表 ---- */
  var gl = document.getElementById("glossary-list");
  function gsec(title) { h("h4", null, title, gl); }
  function gitem(k, text, basis) { h("dt", null, k, gl); var dd = h("dd", null, text, gl); if (basis) h("div", "basis", basis, dd); }
  gsec(T.gTerms);
  Object.keys(G.terms).forEach(function (k) { gitem(T.gTermItem(k), G.terms[k][0], G.terms[k][1]); });
  gsec(T.gSs);
  Object.keys(G.shishen).forEach(function (k) { var it = T.gSsItem(k, G.shishen[k]); gitem(it[0], it[1]); });
  gsec(T.gCs);
  Object.keys(G.changsheng).forEach(function (k) { var it = T.gCsItem(k, G.changsheng[k]); gitem(it[0], it[1]); });
  gsec(T.gWx);
  Object.keys(G.wangxiang).forEach(function (k) { var it = T.gWxItem(k); gitem(it[0], it[1]); });

  pick(2, "gan");
  if (!reduce) cast();
})();
</script>
</body>
