<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飞星盘 子山午向</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* 盘谱：册页上摊开一面罗经——外圈二十四山，内为九宫；右栏为批注（眉批）；盘下一只签筒。
   浅色 = 宣纸册页；深色 = 黑漆描金罗盘。大胆之处只在盘面与竹签，其余安静。
   版式：
   ┌印┐ 子山午向 / 八运宅
   ├──────────────┬────────┤
   │ 罗盘 + 九宫（宫底插签）│ 批注：宫或房间 │
   │ 起盘 | 图层 | 八宅     │ 盘断           │
   │ 签筒：竖排竹签          │                │
   └──────────────┴────────┘ */
:root {
  --paper: #ece2cb;        /* 宣纸 / 熟绢 */
  --paper-2: #e3d6b8;      /* 盘心、卡片 */
  --ink: #26211b;          /* 墨 */
  --ink-soft: #5d5446;     /* 淡墨 */
  --rule: #b9a985;         /* 界栏 */
  --cinnabar: #b03a2e;     /* 朱砂：向星、坐向、印 */
  --azurite: #2f5d6e;      /* 石青：流年 */
  --gold: #9a7431;         /* 铜金：当令 */
  --seal-text: #f6efe0;
  --bamboo: #d9c28a;       /* 竹签 */
  --bamboo-edge: #b89a5b;
  --bamboo-ink: #3b2a12;
  --font-brush: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", "BiauKai", serif;
  --font-song: "Noto Serif SC", "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16120e; --paper-2: #211a14; --ink: #eadcbf; --ink-soft: #b3a283;
    --rule: #5a4a33; --cinnabar: #d9604f; --azurite: #7fb0bf; --gold: #d2a856; --seal-text: #1b130d;
    --bamboo: #8a7444; --bamboo-edge: #6b5631; --bamboo-ink: #f4e6c4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16120e; --paper-2: #211a14; --ink: #eadcbf; --ink-soft: #b3a283;
  --rule: #5a4a33; --cinnabar: #d9604f; --azurite: #7fb0bf; --gold: #d2a856; --seal-text: #1b130d;
  --bamboo: #8a7444; --bamboo-edge: #6b5631; --bamboo-ink: #f4e6c4;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  background-image:
    radial-gradient(ellipse at 20% 0%, color-mix(in srgb, var(--gold) 10%, transparent), transparent 60%),
    radial-gradient(ellipse at 100% 100%, color-mix(in srgb, var(--cinnabar) 6%, transparent), transparent 55%);
  color: var(--ink);
  font-family: var(--font-song);
  font-size: 15px;
  line-height: 1.75;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; }

/* 题签 */
header.title { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 18px; }
.seal { width: 64px; height: 64px; flex: none; margin-top: 6px; }
.seal rect { fill: var(--cinnabar); }
.seal text { fill: var(--seal-text); font-family: var(--font-brush); font-size: 21px; text-anchor: middle; dominant-baseline: central; }
.title-text { min-width: 0; flex: 1 1 320px; }
h1 { font-family: var(--font-brush); font-weight: 400; font-size: clamp(38px, 7vw, 60px); line-height: 1.05; margin: 0; letter-spacing: .06em; text-wrap: balance; }
.subtitle { margin: 6px 0 0; font-size: 16px; color: var(--ink-soft); letter-spacing: .3em; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 8px 0 0; padding: 0; list-style: none; color: var(--ink-soft); font-size: 14px; }
.facts b { color: var(--ink); font-weight: 600; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.badge { font-family: var(--font-brush); font-size: 18px; padding: 0 10px; border: 1.5px solid var(--cinnabar); color: var(--cinnabar); border-radius: 3px; line-height: 1.6; }
.badge.quiet { border-color: var(--rule); color: var(--ink-soft); }
.warn { color: var(--cinnabar); font-size: 14px; margin: 8px 0 0; }

/* 版心：左盘右批 */
.board-wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .board-wrap { grid-template-columns: minmax(0, 1fr); } }

.plate { display: grid; gap: 12px; justify-items: center; }
.plate svg { width: 100%; max-width: 620px; height: auto; display: block; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.chip { font: inherit; font-size: 14px; color: var(--ink-soft); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-soft); background: var(--paper-2); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.btn-cast { font-family: var(--font-brush); font-size: 22px; color: var(--seal-text); background: var(--cinnabar); border: 0; border-radius: 4px; padding: 2px 22px; cursor: pointer; letter-spacing: .2em; }
.btn-cast:hover { filter: brightness(1.08); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.orient { font-size: 13px; color: var(--ink-soft); text-align: center; margin: 0; }

/* 罗盘 SVG */
.ring-outer { fill: var(--paper-2); stroke: var(--rule); }
.ring-line { stroke: var(--rule); stroke-width: 1; fill: none; }
.mt { font-family: var(--font-song); font-size: 15px; fill: var(--ink-soft); text-anchor: middle; dominant-baseline: central; }
.mt.sit, .mt.face { fill: var(--cinnabar); font-weight: 600; font-size: 17px; }
.gua-lab { font-family: var(--font-brush); font-size: 20px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.axis { stroke: var(--cinnabar); stroke-width: 2; }
.axis-cap { fill: var(--cinnabar); }
.axis-text { font-family: var(--font-brush); font-size: 18px; fill: var(--seal-text); text-anchor: middle; dominant-baseline: central; }
.cell rect { fill: var(--paper); stroke: var(--rule); stroke-width: 1; transition: fill .2s; }
.cell { cursor: pointer; outline: none; }
.cell:hover rect { fill: color-mix(in srgb, var(--gold) 12%, var(--paper)); }
.cell.sel rect { fill: color-mix(in srgb, var(--gold) 22%, var(--paper)); stroke: var(--gold); stroke-width: 2; }
.cell:focus-visible rect { stroke: var(--gold); stroke-width: 3; }
.pal { font-size: 13px; fill: var(--ink-soft); text-anchor: middle; dominant-baseline: central; letter-spacing: .1em; }
.yn-wedge { stroke: var(--rule); stroke-width: .8; transition: fill .25s; }
.yn-wedge.ji { fill: color-mix(in srgb, var(--gold) 34%, var(--paper-2)); }
.yn-wedge.xiong { fill: color-mix(in srgb, var(--cinnabar) 20%, var(--paper-2)); }
.yn-wedge.none { fill: transparent; stroke: none; }
.yn-lab { font-family: var(--font-brush); font-size: 18px; text-anchor: middle; dominant-baseline: central; }
.yn-lab.ji { fill: var(--gold); }
.yn-lab.xiong { fill: var(--cinnabar); }
.tag rect { fill: var(--bamboo); stroke: var(--bamboo-edge); stroke-width: 1; }
.tag .tail { fill: var(--cinnabar); stroke: none; }
.tag text { font-family: var(--font-brush); font-size: 14px; fill: var(--bamboo-ink); text-anchor: middle; dominant-baseline: central; }
.tag { cursor: grab; }
.tag.sel rect { stroke: var(--gold); stroke-width: 2.5; }
.cell.drop rect { fill: color-mix(in srgb, var(--azurite) 16%, var(--paper)); stroke: var(--azurite); stroke-width: 2; }
.star { font-family: var(--font-brush); text-anchor: middle; dominant-baseline: central; transition: opacity .35s, transform .35s; }
.star.shan { fill: var(--ink); font-size: 30px; }
.star.xiang { fill: var(--cinnabar); font-size: 30px; }
.star.yun { fill: var(--ink-soft); font-size: 38px; opacity: .55; }
.star.annual { fill: var(--azurite); font-size: 18px; }
.star.month { fill: var(--azurite); font-size: 15px; opacity: .8; }
.star.wang { fill: var(--gold); }
.star.hidden { opacity: 0 !important; }
.sha { fill: var(--cinnabar); }
.path { fill: none; stroke: var(--gold); stroke-width: 2; stroke-dasharray: 4 5; opacity: 0; }
.path.on { opacity: .8; }

/* 批注栏 */
aside.notes { display: grid; gap: 18px; min-width: 0; }
.leaf { border-left: 3px solid var(--cinnabar); padding: 2px 0 2px 16px; min-width: 0; }
.leaf h2 { font-family: var(--font-brush); font-weight: 400; font-size: 28px; margin: 0; line-height: 1.3; }
.leaf .sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 8px; }
.stars { display: grid; grid-template-columns: auto auto 1fr; gap: 4px 12px; margin: 10px 0; align-items: baseline; }
.stars dt { color: var(--ink-soft); font-size: 13px; }
.stars .num { font-family: var(--font-brush); font-size: 22px; line-height: 1; }
.stars .st { font-size: 13px; color: var(--ink-soft); }
.stars .st.good { color: var(--gold); }
.stars .st.bad { color: var(--cinnabar); }
.xiang-quote { font-size: 14px; color: var(--ink-soft); margin: 6px 0; }
.flag { display: inline-block; color: var(--cinnabar); border: 1px solid var(--cinnabar); border-radius: 3px; font-size: 12px; padding: 0 6px; margin-right: 6px; }
.note { margin: 8px 0 0; white-space: pre-wrap; }
.note.empty { color: var(--ink-soft); font-size: 14px; }
.advice { margin: 6px 0 0; padding-left: 1.3em; }
.advice li + li { margin-top: 4px; }

/* 签筒 */
section.tray { display: grid; gap: 8px; width: 100%; max-width: 620px; justify-self: stretch; }
.tray-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.tray-head h3 { font-family: var(--font-brush); font-weight: 400; font-size: 22px; margin: 0; }
.tray-head p { margin: 0; font-size: 14px; color: var(--ink-soft); }
.tray-head button { margin-left: auto; }
.slips { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; min-height: 124px;
  padding: 16px 18px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper-2); }
.slips.drop { border-color: var(--azurite); background: color-mix(in srgb, var(--azurite) 10%, var(--paper-2)); }
.slips .empty { color: var(--ink-soft); font-size: 14px; align-self: center; }
.slip { writing-mode: vertical-rl; font-family: var(--font-brush); font-size: 21px; letter-spacing: .18em; line-height: 1;
  color: var(--bamboo-ink); background: var(--bamboo); border: 1px solid var(--bamboo-edge); border-radius: 5px 5px 3px 3px;
  width: 40px; min-height: 100px; padding: 12px 0 28px; cursor: grab; touch-action: none; user-select: none;
  box-shadow: inset 0 -16px 0 var(--cinnabar); transition: transform .15s; }
.slip:hover { transform: translateY(-4px); }
.slip[aria-pressed="true"] { transform: translateY(-10px); outline: 2px solid var(--gold); outline-offset: 2px; }
.ghost { position: fixed; z-index: 20; pointer-events: none; opacity: .9; transform: translate(-50%, -60%) rotate(-4deg); }
.leaf .tools { display: flex; gap: 8px; margin-top: 10px; }
.bz { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0; font-size: 14px; }
.bz dt { color: var(--ink-soft); }
.bz dd { margin: 0; }
.bz .ji { color: var(--gold); }
.bz .xiong { color: var(--cinnabar); }

/* 九运旺衰 */
section.legend h3, aside.notes h3 { font-family: var(--font-brush); font-weight: 400; font-size: 22px; margin: 0 0 6px; }
.status-row { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 560px) { .status-row { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.status-row div { border: 1px solid var(--rule); border-radius: 3px; padding: 6px 4px; text-align: center; background: var(--paper-2); }
.status-row .n { font-family: var(--font-brush); font-size: 24px; display: block; line-height: 1.1; }
.status-row .s { font-size: 12px; color: var(--ink-soft); }
.status-row .good { border-color: var(--gold); }
.status-row .good .n { color: var(--gold); }
.status-row .bad .n { color: var(--cinnabar); }

footer { border-top: 1px solid var(--rule); padding-top: 14px; color: var(--ink-soft); font-size: 13px; display: grid; gap: 4px; }
footer p { margin: 0; }

@media (prefers-reduced-motion: reduce) { .star, .cell rect, .slip, .yn-wedge { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <header class="title">
    <svg class="seal" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="2" y="2" width="60" height="60" rx="5"></rect>
      <text x="45" y="20">堪</text><text x="45" y="44">輿</text>
      <text x="19" y="20">子</text><text x="19" y="44">印</text>
    </svg>
    <div class="title-text">
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
      <ul class="facts" id="facts"></ul>
      <div class="badges" id="badges"></div>
      <div id="warnings"></div>
    </div>
  </header>

  <div class="board-wrap">
    <div class="plate">
      <svg id="board" viewBox="-30 -30 700 700" role="img" aria-labelledby="board-desc">
        <desc id="board-desc">玄空飞星九宫盘，上南下北。外圈为二十四山。</desc>
      </svg>
      <div class="toolbar" role="group" aria-label="图层">
        <button class="btn-cast" id="cast" type="button">起盘</button>
        <button class="chip" type="button" data-layer="yun" aria-pressed="true"><span class="dot" style="background:var(--ink-soft)"></span>运盘</button>
        <button class="chip" type="button" data-layer="shan" aria-pressed="true"><span class="dot" style="background:var(--ink)"></span>山星</button>
        <button class="chip" type="button" data-layer="xiang" aria-pressed="true"><span class="dot" style="background:var(--cinnabar)"></span>向星</button>
        <button class="chip" type="button" data-layer="annual" aria-pressed="true" id="chip-annual"><span class="dot" style="background:var(--azurite)"></span>流年</button>
        <button class="chip" type="button" data-layer="month" aria-pressed="true" id="chip-month"><span class="dot" style="background:var(--azurite);opacity:.7"></span>流月</button>
      </div>
      <div class="toolbar" role="radiogroup" aria-label="八宅吉凶" id="bz-chips"></div>
      <p class="orient">上南下北，左东右西，依罗经旧式。每宫左上为山星（墨，管人丁），右上为向星（朱，管财），中间大字为运星，右侧小字为流年。金色为当令之星。</p>
      <section class="tray" aria-labelledby="tray-title">
        <div class="tray-head">
          <h3 id="tray-title">签筒</h3>
          <p id="tray-hint">把房间签拖到盘上的方位；手机上先点签，再点一宫。拖回签筒即取下。</p>
          <button class="chip" type="button" id="reset">复原</button>
        </div>
        <div class="slips" id="slips"></div>
      </section>
    </div>

    <aside class="notes" aria-live="polite">
      <div class="leaf" id="palace"></div>
      <div class="leaf" id="overall"></div>
    </aside>
  </div>

  <section class="legend">
    <h3 id="legend-title"></h3>
    <div class="status-row" id="status-row"></div>
  </section>

  <footer>
    <p id="source"></p>
    <p>风水为辅，人为为主。本盘由脚本按《沈氏玄空学》排盘规则计算；断语为传统取象，仅供参考。</p>
  </footer>

    D.entries.forEach(function (e) { parts.push(e); });
    parts.forEach(function (t) { h("p", "sub", t, box); });
    if (D.notes.summary) h("p", "note", D.notes.summary, box);
    if (D.notes.advice && D.notes.advice.length) {
      var ul = h("ul", "advice", null, box);
      D.notes.advice.forEach(function (a) { h("li", null, a, ul); });
    }
    if (!D.notes.summary && !(D.notes.advice || []).length) h("p", "note empty", "完整解读见对话。", box);
  })();

  /* ---- 旺衰 ---- */
  document.getElementById("legend-title").textContent = D.current_yun_cn + "运星曜旺衰";
  var row = document.getElementById("status-row");
  for (var n = 1; n <= 9; n++) {
    var d = h("div", stClass(D.status[n]), null, row);
    h("span", "n", NUM[n], d); h("span", "s", D.star_names[n].slice(2) + "，" + D.status[n].replace("（下运旺）", ""), d);
  }
  document.getElementById("source").textContent = D.source;

  /* ---- 图层 ---- */
  var visible = { yun: true, shan: true, xiang: true, annual: true, month: true };
  if (!D.layers.annual) document.getElementById("chip-annual").hidden = true;
  if (!D.layers.month) document.getElementById("chip-month").hidden = true;
  function applyLayers() {
    Object.keys(starEls).forEach(function (pal) {
      Object.keys(starEls[pal]).forEach(function (k) { starEls[pal][k].classList.toggle("hidden", !visible[k]); });
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-layer]"), function (b) {
    b.addEventListener("click", function () {
      var k = b.getAttribute("data-layer"); visible[k] = !visible[k];
      b.setAttribute("aria-pressed", String(visible[k])); applyLayers();
    });
  });

  /* ---- 八宅图层 ---- */
  var bzSel = 0;   // 默认显示宅卦吉凶
  function applyBazhai() {
    D.gua_ring.forEach(function (g) {
      var e = guaEls[g.name], s = subjects[bzSel], y = s ? s.younian[g.name] : null;
      e.wedge.setAttribute("class", "yn-wedge " + (y ? (JI[y] ? "ji" : "xiong") : "none"));
      e.text.textContent = y || g.name;
      e.text.setAttribute("class", y ? "yn-lab " + (JI[y] ? "ji" : "xiong") : "gua-lab");
    });
    Array.prototype.forEach.call(document.querySelectorAll("#bz-chips .chip"), function (b, i) {
      b.setAttribute("aria-checked", String(i - 1 === bzSel)); b.setAttribute("aria-pressed", String(i - 1 === bzSel));
    });
  }
  (function () {
    var box = document.getElementById("bz-chips");
    h("span", "orient", "八宅吉凶", box);
    var labels = ["关"].concat(subjects.map(function (s, i) { return i === 0 ? "宅" : s.label; }));
    labels.forEach(function (label, i) {
      var b = h("button", "chip", label, box); b.type = "button"; b.setAttribute("role", "radio");
      b.addEventListener("click", function () { bzSel = i - 1; applyBazhai(); });
    });
  })();

  /* ---- 签筒：房间签的放置 ---- */
  var place = {}, origin = {}, armed = null;
  D.rooms.forEach(function (r) { place[r.name] = r.palace; origin[r.name] = r.palace; });
  var slipsBox = document.getElementById("slips");
  function drawTags() {
    Object.keys(tagLayer).forEach(function (pal) {
      var layer = tagLayer[pal]; layer.textContent = "";
      var names = D.rooms.map(function (r) { return r.name; }).filter(function (n) { return place[n] === pal; });
      var x0 = cellBox[pal][0], y0 = cellBox[pal][1], tw = 46, gap = 4;
      var show = names.slice(0, 2), total = show.length * tw + (show.length - 1) * gap;
      show.forEach(function (n, i) {
        var g = el("g", { "class": "tag", "data-room": n, tabindex: "0", role: "button", "aria-label": n + "，在" + pal + "宫" }, null, layer);
        var x = x0 + (cw - total) / 2 + i * (tw + gap), y = y0 + cw - 24;
        el("rect", { x: x, y: y, width: tw, height: 19, rx: 3 }, null, g);
        el("rect", { x: x + tw - 7, y: y, width: 7, height: 19, rx: 2, "class": "tail" }, null, g);
        el("text", { x: x + (tw - 7) / 2, y: y + 10 }, n.length > 3 ? n.slice(0, 3) : n, g);
        bindDrag(g, n);
        g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectRoom(n); } });
      });
      if (names.length > 2) el("text", { x: x0 + cw - 8, y: y0 + cw - 14, "class": "pal" }, "+" + (names.length - 2), layer);
    });
  }
  function drawSlips() {
    slipsBox.textContent = "";
    var free = D.rooms.filter(function (r) { return !place[r.name]; });
    free.forEach(function (r) {
      var b = h("button", "slip", r.name, slipsBox); b.type = "button";
      b.setAttribute("aria-pressed", String(armed === r.name));
      b.setAttribute("aria-label", r.name + "，未放置");
      bindDrag(b, r.name);
      b.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); arm(r.name); } });
    });
    if (!free.length) h("span", "empty", "签都已放到盘上。拖回这里即可取下。", slipsBox);
  }
  function save() { try { localStorage.setItem("fengshui-rooms:" + D.title + D.subtitle, JSON.stringify(place)); } catch (e) {} }
  function setPlace(name, pal) { place[name] = pal; armed = null; drawTags(); drawSlips(); save(); }
  function arm(name) { armed = armed === name ? null : name; drawSlips(); }
  function onCell(pal) {
    if (armed) { var n = armed; setPlace(n, pal); selectRoom(n); }
    else select(pal);
  }
  /* 拖放：pointer 事件，鼠标与触屏通用；移动不足 5px 视为点按 */
  function bindDrag(node, name) {
    node.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      var sx = e.clientX, sy = e.clientY, ghost = null, over = null;
      function target(ev) {
        var t = document.elementFromPoint(ev.clientX, ev.clientY);
        while (t && t !== document.body) {
          if (t.getAttribute && t.getAttribute("data-pal")) return { pal: t.getAttribute("data-pal"), node: t };
          if (t === slipsBox) return { pal: null, node: t };
          t = t.parentNode;
        }
        return null;
      }
      function move(ev) {
        if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
        if (!ghost) { ghost = h("div", "slip ghost", name, document.body); }
        ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px";
        var t = target(ev);
        if (over && (!t || t.node !== over)) over.classList.remove("drop");
        over = t ? t.node : null; if (over) over.classList.add("drop");
      }
      function up(ev) {
        document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up);
        if (over) over.classList.remove("drop");
        if (!ghost) {                                   // 点按
          if (place[name]) selectRoom(name); else arm(name);
          return;
        }
        ghost.remove();
        var t = target(ev);
        if (!t) return;
        if (t.pal) { setPlace(name, t.pal); selectRoom(name); }
        else { var was = place[name]; setPlace(name, null); if (was) select(was); }
      }
      document.addEventListener("pointermove", move); document.addEventListener("pointerup", up);
      e.preventDefault();
    });
  }
  document.getElementById("reset").addEventListener("click", function () {
    D.rooms.forEach(function (r) { place[r.name] = r.palace; }); armed = null; drawTags(); drawSlips(); save();
    select(D.face_palace);
  });
  try {
    var saved = JSON.parse(localStorage.getItem("fengshui-rooms:" + D.title + D.subtitle) || "null");
    if (saved) Object.keys(saved).forEach(function (n) { if (n in place && (saved[n] === null || D.palaces[saved[n]])) place[n] = saved[n]; });
  } catch (e) {}
  if (!D.rooms.some(function (r) { return r.palace; })) document.getElementById("reset").hidden = true;
  drawTags(); drawSlips(); applyBazhai();

  /* ---- 起盘：按洛书轨迹逐宫飞布 ---- */
  var timers = [];
  function cast() {
    timers.forEach(clearTimeout); timers = [];
    if (reduce) { applyLayers(); return; }
    var order = ["yun", "shan", "xiang", "annual", "month"].filter(function (k) { return D.layers[k] && visible[k]; });
    order.forEach(function (k) { D.path.forEach(function (pal) { starEls[pal][k].classList.add("hidden"); }); });
    path.classList.add("on");
    var t = 300, step = 150;
    order.forEach(function (k) {
      D.path.forEach(function (pal) {
        timers.push(setTimeout(function () { starEls[pal][k].classList.remove("hidden"); select(pal); }, t));
        t += step;
      });
      t += 350;
    });
    timers.push(setTimeout(function () { path.classList.remove("on"); select(D.face_palace); }, t));
  }
  document.getElementById("cast").addEventListener("click", cast);

  select(D.face_palace);
  if (!reduce && D.autoplay) cast();
})();
</script>
</body>
</html>
